  function viewTimeline(){
    var tv=S.tlView||"months";
    var html='<h2 class="view-h">Timeline</h2><p class="sub">Your scheduled work over time — project phases (bars), tasks (dots), and events (◆). It fills in automatically from your tasks.'+(scopeActive()?' <b>Filtered:</b> '+esc(scopeLabel())+' — <button class="chip" data-act="clearscope" style="padding:2px 9px">show all</button>':'')+'</p>';
    html+='<div class="chips" style="margin-bottom:8px">'+[["months","Months"],["weeks","Weeks"],["days","Days"]].map(function(v){return '<button class="chip" data-act="tlview" data-v="'+v[0]+'" aria-pressed="'+(tv===v[0])+'">'+v[1]+'</button>';}).join("")+'</div>';
    html+='<div class="tl-legend"><span>▬ phase</span><span>● tasks on a day — click to open it</span><span>◆ event</span></div>';
    // completed work stays on the timeline — it is a record of the term, not just a to-do forecast
    var datedTasks=S.tasks.filter(function(k){ return k.day && inScope(k.projectId); });
    var scopedPhases=S.phases.filter(function(ph){ return inScope(ph.projectId); });
    var scopedEvents=S.events.filter(function(ev){ return ev.date && sourceEnabled(ev) && !(ev.projectId&&!inScope(ev.projectId)); });
    if(!datedTasks.length && !scopedPhases.length && !scopedEvents.length){ html+='<div class="card empty" style="padding:40px">Nothing scheduled yet. Give tasks a date (or add project phases) and they\'ll appear here across time.</div>'; return html; }
    var dates=[today()];
    scopedPhases.forEach(function(ph){ dates.push(ph.start); dates.push(ph.end); });
    datedTasks.forEach(function(k){ dates.push(k.day); });
    scopedEvents.forEach(function(ev){ dates.push(ev.date); });
    dates.sort();
    var min=dates[0], max=dates[dates.length-1];
    min=addDays(min,-3); max=addDays(max,3);
    var span=Math.max(diffDays(max,min)+1,14);
    var PPD={months:6,weeks:18,days:34}[tv]||6;
    var trackW=span*PPD;
    // scale ticks — real dates, sized to the zoom level
    var ticks=[];
    if(tv==="months"){
      var d=parse(min), seen=[];
      while(fmt(d)<=max){ var mk=fmt(d).slice(0,7); if(seen.indexOf(mk)<0){ seen.push(mk); ticks.push({label:MONTHS[+mk.slice(5,7)-1].slice(0,3)+" "+mk.slice(0,4),w:daysInMonthClamped(mk,min,max)*PPD,major:true}); } d.setDate(d.getDate()+1); }
    } else if(tv==="weeks"){
      var ws=addDays(min,-dow(min)), lastM=null;
      while(ws<=max){
        var s=ws<min?min:ws, e=addDays(ws,6)>max?max:addDays(ws,6);
        var sd2=parse(s), mlbl=MONTHS[sd2.getMonth()].slice(0,3);
        ticks.push({label:mlbl+" "+sd2.getDate(),w:(diffDays(e,s)+1)*PPD,major:mlbl!==lastM});
        lastM=mlbl; ws=addDays(ws,7);
      }
    } else {
      var dd=min;
      while(dd<=max){ var dn=+dd.slice(8);
        ticks.push({label:dn===1?MONTHS[+dd.slice(5,7)-1].slice(0,3)+" 1":String(dn),w:PPD,major:dn===1||dow(dd)===0});
        dd=addDays(dd,1); }
    }
    html+='<div class="tl-scroll"><div class="tl" style="min-width:'+(trackW+134)+'px">';
    html+='<div class="tl-months" style="margin-left:130px;width:'+trackW+'px">'+
      ticks.map(function(tk){return '<div class="tl-tick'+(tk.major?" major":"")+'" style="flex:0 0 '+tk.w+'px">'+tk.label+'</div>';}).join("")+'</div>';
    // rows by project — phase bars + task dots + event diamonds
    var todayLeft=(today()>=min&&today()<=max)?diffDays(today(),min)*PPD:null;
    function trackFor(color, phs, tasks, evs){
      var track=(todayLeft!==null?'<div class="tl-today" style="left:'+todayLeft+'px"></div>':"");
      (phs||[]).forEach(function(ph){
        var left=diffDays(ph.start,min)*PPD, width=Math.max((diffDays(ph.end,ph.start)+1)*PPD,18);
        track+='<div class="tl-bar" style="left:'+left+'px;width:'+width+'px;background:'+color+';opacity:.55" data-act="delphase" data-id="'+ph.id+'" title="'+esc(ph.title)+' · '+niceDate(ph.start)+' → '+niceDate(ph.end)+' — click to remove">'+esc(ph.title)+'</div>';
      });
      var byDay={}; (tasks||[]).forEach(function(k){ (byDay[k.day]=byDay[k.day]||[]).push(k); });
      Object.keys(byDay).forEach(function(day){ var left=diffDays(day,min)*PPD; var n=byDay[day].length;
        var titles=byDay[day].map(function(k){return (k.priority?"★ ":"")+k.title;}).join(" · ");
        track+='<div class="tl-dot" style="left:'+left+'px;background:'+color+'" data-act="tl-day" data-d="'+day+'" title="'+esc(niceDate(day)+" — "+titles)+'">'+(n>1?n:'')+'</div>';
      });
      (evs||[]).forEach(function(ev){ var left=diffDays(ev.date,min)*PPD; track+='<div class="tl-ev" data-act="calday" data-d="'+ev.date+'" style="left:'+left+'px;cursor:pointer" title="'+esc(ev.title+" · "+niceDate(ev.date))+'"></div>'; });
      return track;
    }
    S.projects.forEach(function(p){
      if(!inScope(p.id)) return;
      var phs=scopedPhases.filter(function(x){return x.projectId===p.id;});
      var pt=datedTasks.filter(function(k){return k.projectId===p.id;});
      var pe=scopedEvents.filter(function(ev){return ev.projectId===p.id;});
      if(!phs.length && !pt.length && !pe.length) return;
      html+='<div class="tl-row"><div class="tl-name" title="'+esc(p.name)+'"><span class="pdot" style="background:'+p.color+'"></span><span style="overflow:hidden;text-overflow:ellipsis">'+(p.emoji?esc(p.emoji)+" ":"")+esc(p.name)+'</span></div>'+
        '<div class="tl-track" style="flex:0 0 '+trackW+'px">'+trackFor(p.color,phs,pt,pe)+'</div></div>';
    });
    var noneTasks=datedTasks.filter(function(k){return !k.projectId;});
    var noneEvents=scopedEvents.filter(function(ev){return !ev.projectId;});
    if(noneTasks.length||noneEvents.length){
      html+='<div class="tl-row"><div class="tl-name" style="color:var(--ink-soft)">No project</div>'+
        '<div class="tl-track" style="flex:0 0 '+trackW+'px">'+trackFor("var(--ink-faint)",[],noneTasks,noneEvents)+'</div></div>';
    }
    html+='</div></div>';
    return html;
  }

  function toggleTask(id){ var k=S.tasks.find(function(x){return x.id===id;}); if(!k)return;
    var toDone=k.status!=="done";   // skipped ticks straight to done — the check always means "I did it"
    function commit(){ k.status=toDone?"done":"todo"; k.completedOn=toDone?(view==="today"?viewDay:today()):null; save(); render(); }
    if(!toDone || matchMedia("(prefers-reduced-motion: reduce)").matches){ commit(); return; }
    // Let the row finish its tick — check fills, title strikes, row settles — before it moves to Done.
    var rows=[].slice.call(document.querySelectorAll('.task[data-id="'+id+'"]'));
    [].forEach.call(document.querySelectorAll('.chk[data-tid="'+id+'"]'),function(c){ var r=c.closest(".task"); if(r&&rows.indexOf(r)<0) rows.push(r); });   // focus rows carry the task id on the checkbox
    if(!rows.length){ commit(); return; }
    if(rows.some(function(r){ return r.classList.contains("completing"); })) return;   // already on its way
    rows.forEach(function(r){ r.classList.add("completing"); var c=r.querySelector(":scope > .chk"); if(c) c.classList.add("done"); });
    try{ navigator.vibrate&&navigator.vibrate(12); }catch(e){}
    setTimeout(commit, 380);
  }

  function addSubInline(taskId,val){
    val=(val||"").trim(); if(!val) return;
    var k=S.tasks.find(function(x){return x.id===taskId;}); if(!k) return;
    k.subs=k.subs||[]; k.subs.push({id:uid(),text:val,done:false});
    pendingSubAdd=taskId; save(); render();
  }
  function nestTask(childId,parentId){
    if(!childId||childId===parentId) return;
    var ci=S.tasks.findIndex(function(x){return x.id===childId;});
    var parent=S.tasks.find(function(x){return x.id===parentId;});
    if(ci<0||!parent||parent.status==="done") return;
    var child=S.tasks[ci];
    parent.subs=parent.subs||[];
    parent.subs.push({id:child.id,text:child.title,done:child.status==="done"});
    (child.subs||[]).forEach(function(s){ parent.subs.push(s); });
    S.tasks.splice(ci,1);
    save(); render();
    toastUndo("Nested under “"+parent.title.slice(0,32)+(parent.title.length>32?"…":"")+"”",function(){
      var childSubIds={}; (child.subs||[]).forEach(function(s){ childSubIds[s.id]=1; });
      parent.subs=parent.subs.filter(function(s){ return s.id!==child.id && !childSubIds[s.id]; });
      S.tasks.splice(Math.min(ci,S.tasks.length),0,child); save(); render();
    });
  }

  /* ---------- natural-language dates ---------- */
  var NLDOW={sun:0,mon:1,tue:2,wed:3,thu:4,fri:5,sat:6};
  var NLMON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
  /* @-tags — @project, @morning, @tomorrow, @3pm… — usable in any add box */
  function blockForTime(at){ var h=+at.slice(0,2); return h<12?"morning":(h<17?"afternoon":"evening"); }
  /* ---------- capacity (Phase 32) ----------
     Every task has had a length since the Day view grew blocks, but nothing ever added them up. This
     does: timed tasks count at their length; untimed ones only when you gave them one (an implicit
     "1 hour" on every loose to-do would inflate the day into fiction). The day ends at DAY_END. */
  var DAY_END=22*60;
  var BLOCK_WIN={morning:[6*60,12*60], afternoon:[12*60,17*60], evening:[17*60,DAY_END]};
  function toMins(at){ return +at.slice(0,2)*60 + +at.slice(3,5); }
  function dayLoad(d){
    var open=S.tasks.filter(function(k){ return taskOnDay(k,d) && isOpen(k) && inScope(k.projectId); });
    var planned=0, unsized=0;
    open.forEach(function(k){ if(k.at) planned+=(k.dur||60); else if(k.dur) planned+=k.dur; else unsized++; });
    var left=null;
    if(d===today()){ var n=new Date(); left=Math.max(0, DAY_END-(n.getHours()*60+n.getMinutes())); }
    return {planned:planned, unsized:unsized, left:left, open:open.length};
  }
  function capacityHtml(d){
    var L=dayLoad(d); if(!L.open) return "";
    var over=L.left!==null && L.planned>L.left;
    var bits=['⏱ <b>'+fmtMins(L.planned)+'</b> planned'];
    if(L.unsized) bits.push(L.unsized+' without a length');
    if(L.left===0) bits.push('the day’s done — plan tomorrow');
    else if(L.left!==null) bits.push(over?'<b>only '+fmtMins(L.left)+' left today</b>':fmtMins(L.left)+' left today');
    return '<div class="day-cap'+(over?" over":"")+'" title="Lengths come from each task’s Length field; a timed task counts as 1 hour when unset">'+bits.join(' · ')+'</div>';
  }
  /* "Plan my day": pack the unscheduled tasks into the day's free gaps — the Structured / Motion
     move. Important first, then by list order; each one goes into the earliest gap that fits inside
     its block's window (a morning task stays in the morning), anywhere in the day if that fails.
     Today starts from the next quarter hour, not 6am. Undoable like every bulk action. */
  function planDay(d){
    var open=S.tasks.filter(function(k){ return taskOnDay(k,d) && isOpen(k) && inScope(k.projectId); });
    var todo=orderTasks(open.filter(function(k){ return !k.at; }),false);
    if(!todo.length){ toast("Nothing unscheduled — the day is already planned"); return; }

    take(/\b(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\s*$/i,function(mm){ wdDay(mm,false); }) ||

  /* ---------- 39: tidy repeating tasks ----------
     Repeats rot in two ways this fixes. (1) The same rule gets created twice on two devices, so a day
     mints two or three copies of one habit. (2) A one-off obligation with a deadline gets entered as a
     daily repeat to nag — which is what a `due` date is for, and which generated sixteen copies of one
     MacBook errand. Every row here is a decision the user can change; nothing is applied until Apply. */
  function tplStats(tp){
    var ins=S.tasks.filter(function(k){return k.tplId===tp.id;});
    var done=ins.filter(function(k){return k.status==="done";});
    var last=""; done.forEach(function(k){ if((k.completedOn||"")>last) last=k.completedOn||""; });
    return {n:ins.length, done:done.length, open:ins.filter(isOpen).length,
            skipped:ins.filter(isSkipped).length, last:last};
  }
  function tplSuggest(tp,dupOf){
    if(dupOf) return "merge";
    if(tp.until && tp.until<today()) return "stop";
    var st=tplStats(tp);
    // generated a lot, finished almost none: it was never a habit, it was a reminder with a deadline
    if(st.n>=5 && st.done<=1) return "convert";
    // daily, and you actually do it — that is a habit that belongs in the day, not a task that repeats
    if(tp.freq==="daily" && st.n>=10 && st.done/st.n>=0.3) return "habit";
    return "keep";
  }
  function openTidyRepeatsModal(){
    if(!S.templates.length){ toast("No repeating tasks to tidy"); return; }
    // survivors first: for a duplicated title, keep the one with the most completions
    var byTitle={};
    S.templates.forEach(function(tp){
      var key=norm(tp.title||"");
      (byTitle[key]=byTitle[key]||[]).push(tp);
    });
    Object.keys(byTitle).forEach(function(key){
      byTitle[key].sort(function(a,b){ return tplStats(b).done-tplStats(a).done; });
    });
    var dupOf={};      // template id -> id of the survivor it merges into
    Object.keys(byTitle).forEach(function(key){
      var grp=byTitle[key]; if(grp.length<2) return;
      grp.slice(1).forEach(function(tp){ dupOf[tp.id]=grp[0].id; });
    });
    var choice={};
    S.templates.forEach(function(tp){ choice[tp.id]=tplSuggest(tp,dupOf[tp.id]); });
    var dueVal={};
    S.templates.forEach(function(tp){ dueVal[tp.id]=addDays(today(),7); });

    var OPTS=[["keep","Keep repeating"],["merge","Merge into the copy above"],
              ["habit","Make it a habit shown in my day (keeps the streak)"],
              ["convert","Make it one task with a due date"],["wait","Park it as Waiting — check back every 3 weeks"],
              ["stop","Stop repeating (keep the history)"],["wipe","Delete it and all its rows"]];
    function body(){
      var dayDupes=0, seen={};
      S.tasks.forEach(function(k){ if(!k.tplId||!isOpen(k)) return; var key=k.tplId+"|"+k.day;
        if(seen[key]) dayDupes++; else seen[key]=1; });
      var h='<h3>↻ Tidy repeating tasks</h3><p class="sub">'+S.templates.length+' repeating rule'+
        (S.templates.length===1?'':'s')+
        (Object.keys(dupOf).length?' · <b>'+Object.keys(dupOf).length+' look like duplicates</b>':'')+
        '. Change any row; nothing happens until you apply.</p>';
      h+='<div class="tidy-list">';
      Object.keys(byTitle).forEach(function(key){
        byTitle[key].forEach(function(tp,i){
          var st=tplStats(tp), p=tp.projectId?proj(tp.projectId):null, dup=!!dupOf[tp.id];
          h+='<div class="tidy-row'+(dup?" dup":"")+'"><div class="tidy-main">'+
            '<div class="tidy-t">'+esc(tp.title||"Untitled")+(dup?' <span class="pill skip">duplicate of the row above</span>':'')+'</div>'+
            '<div class="task-meta"><span class="pill rec">'+recDesc(tp)+'</span>'+
              (p?'<span class="pill proj" style="--pc:'+esc(p.color)+'"><i class="pdot"></i>'+esc(p.name)+'</span>':'')+
              '<span class="pill block">'+st.n+' row'+(st.n===1?'':'s')+'</span>'+
              '<span class="pill '+(st.done?'good':'block')+'">'+st.done+' done</span>'+
              (st.open?'<span class="pill aged">'+st.open+' still open</span>':'')+
              (st.skipped?'<span class="pill skip">⤬ '+st.skipped+' skipped</span>':'')+
              (tp.until?'<span class="pill block">until '+esc(niceDate(tp.until))+'</span>':'')+
              (st.last?'<span class="pill block">last done '+esc(niceDate(st.last))+'</span>':'')+
            '</div></div>'+
            '<div class="tidy-pick"><select data-tidy="'+tp.id+'" aria-label="What to do with '+esc(tp.title||"")+'">'+
              OPTS.filter(function(o){ return o[0]!=="merge"||dup; }).map(function(o){
                return '<option value="'+o[0]+'"'+(choice[tp.id]===o[0]?" selected":"")+'>'+o[1]+'</option>'; }).join("")+
            '</select>'+
            (choice[tp.id]==="convert"?'<label class="rv-date" title="Due date for the single task"><span>⚑</span>'+
              '<input type="date" data-tidydue="'+tp.id+'" value="'+esc(dueVal[tp.id])+'"/></label>':'')+

        });

      h+='</div>';
      if(dayDupes) h+='<p class="sub" style="margin:10px 0 0">Also found <b>'+dayDupes+
        ' duplicate row'+(dayDupes===1?'':'s')+'</b> on days that already had that repeat — applying clears those too.</p>';

        '<button class="btn primary" data-tidy-apply>Apply</button></div>';

    function apply(){
      var snap=JSON.stringify({tasks:S.tasks,templates:S.templates,habits:S.habits,habitLog:S.habitLog});
      var removedT=0, madeTasks=0, removedRows=0, madeHabits=0;
      // 1. merge duplicates onto their survivor, then drop the extra rule
      S.templates.slice().forEach(function(tp){
        if(choice[tp.id]!=="merge") return;
        var keep=dupOf[tp.id];
        S.tasks.forEach(function(k){ if(k.tplId===tp.id) k.tplId=keep; });
        S.templates=S.templates.filter(function(x){return x.id!==tp.id;}); removedT++;
      });
      // 2. a repeat that was really a deadline becomes one task with a due date
      S.templates.slice().forEach(function(tp){
        if(choice[tp.id]!=="convert") return;
        var before=S.tasks.length;
        S.tasks=S.tasks.filter(function(k){ return !(k.tplId===tp.id && isOpen(k)); });
        removedRows+=before-S.tasks.length;
        S.tasks.push({id:uid(),title:tp.title,projectId:tp.projectId||null,status:"todo",day:null,
          block:tp.block||null,at:null,priority:true,rollover:0,due:dueVal[tp.id]||addDays(today(),7),
          subs:[],created:today()});
        madeTasks++;
        S.templates=S.templates.filter(function(x){return x.id!==tp.id;}); removedT++;
      });
      // 2a. a daily repeat you actually do becomes a habit in the day; its completions become the streak
      S.templates.slice().forEach(function(tp){
        if(choice[tp.id]!=="habit") return;
        var hid=uid(), goal=1;
        var existing=S.habits.find(function(x){ return norm(x.name)===norm(tp.title); });
        if(existing){ hid=existing.id; existing.inDay=true; } else S.habits.push({id:hid,name:tp.title,goal:goal,inDay:true});
        S.tasks.forEach(function(k){ if(k.tplId===tp.id && k.status==="done" && k.completedOn) setHabitLog(k.completedOn,hid,Math.max(habitLog(k.completedOn,hid),goal)); });
        var before=S.tasks.length;
        S.tasks=S.tasks.filter(function(k){ return !(k.tplId===tp.id && !(k.status==="done")); });   // open + skipped rows go; completions stay as history
        removedRows+=before-S.tasks.length;
        S.templates=S.templates.filter(function(x){return x.id!==tp.id;}); removedT++; madeHabits++;
      });
      // 2b. a correspondence loop (a dispute, an application) becomes one Waiting item on a rhythm
      S.templates.slice().forEach(function(tp){
        if(choice[tp.id]!=="wait") return;
        var before=S.tasks.length;
        S.tasks=S.tasks.filter(function(k){ return !(k.tplId===tp.id && isOpen(k)); });
        removedRows+=before-S.tasks.length;
        var wk={id:uid(),title:tp.title,projectId:tp.projectId||null,status:"todo",day:null,block:null,at:null,
          priority:false,rollover:0,subs:[],created:today()};
        parkTask(wk,{waitOn:null,cycle:{every:3,unit:"week",from:"done"}});
        S.tasks.push(wk); madeTasks++;
        S.templates=S.templates.filter(function(x){return x.id!==tp.id;}); removedT++;
      });
      // 3. stop repeating: the rule and its unfinished rows go, the history stays
      S.templates.slice().forEach(function(tp){
        if(choice[tp.id]!=="stop") return;
        var before=S.tasks.length;
        S.tasks=S.tasks.filter(function(k){ return !(k.tplId===tp.id && isOpen(k)); });
        removedRows+=before-S.tasks.length;
        S.templates=S.templates.filter(function(x){return x.id!==tp.id;}); removedT++;
      });
      // 4. wipe: rule and every row it ever made
      S.templates.slice().forEach(function(tp){
        if(choice[tp.id]!=="wipe") return;
        var before=S.tasks.length;
        S.tasks=S.tasks.filter(function(k){ return k.tplId!==tp.id; });
        removedRows+=before-S.tasks.length;
        S.templates=S.templates.filter(function(x){return x.id!==tp.id;}); removedT++;
      });
      // 5. one row per repeat per day. Merging two rules leaves two rows on every shared day, past
      //    days included — keep the most informative one: a completion beats an open row beats a skip.
      var rank=function(k){ return k.status==="done"?3:(isSkipped(k)?1:2); };
      var best={};
      S.tasks.forEach(function(k){
        if(!k.tplId) return;
        var key=k.tplId+"|"+k.day;
        if(!best[key] || rank(k)>rank(best[key])) best[key]=k;
      });
      var keepRows=[];
      S.tasks.forEach(function(k){
        if(!k.tplId){ keepRows.push(k); return; }
        if(best[k.tplId+"|"+k.day]===k){ keepRows.push(k); return; }
        removedRows++;
      });
      S.tasks=keepRows;
      save(); close(); render();
      toastUndo(removedT+" rule"+(removedT===1?"":"s")+" tidied · "+removedRows+" row"+(removedRows===1?"":"s")+
        " cleared"+(madeTasks?" · "+madeTasks+" task"+(madeTasks===1?"":"s")+" created":"")+(madeHabits?" · "+madeHabits+" habit"+(madeHabits===1?"":"s")+" in your day":""),
        function(){ var b=JSON.parse(snap); S.tasks=b.tasks; S.templates=b.templates; S.habits=b.habits; S.habitLog=b.habitLog; save(); render(); });
    }

  function importICS(){

        evs.forEach(function(e){ if(!S.events.some(function(x){return x.uid&&x.uid===e.uid&&!x.sourceId;})){ S.events.push({id:uid(),uid:e.uid,title:e.title||"(event)",date:e.date,source:"ics"}); n++; } });

  function parseEvents(text){
    var lines=text.replace(/\r\n[ \t]/g,"").split(/\r?\n/); var cur=null,out=[];
    lines.forEach(function(l){
      if(l.indexOf("BEGIN:VEVENT")===0) cur={};
      else if(l.indexOf("END:VEVENT")===0){ if(cur&&cur.date) out.push(cur); cur=null; }
      else if(cur){
        if(l.indexOf("SUMMARY")===0) cur.title=l.slice(l.indexOf(":")+1);
        else if(l.indexOf("UID")===0) cur.uid=l.slice(l.indexOf(":")+1);
        else if(l.indexOf("RRULE")===0) cur.rrule=l.slice(l.indexOf(":")+1);
        else if(l.indexOf("DTSTART")===0){ var m=l.slice(l.indexOf(":")+1).replace(/[^0-9]/g,""); if(m.length>=8) cur.date=m.slice(0,4)+"-"+m.slice(4,6)+"-"+m.slice(6,8); }
      }
    });
    return out;
  }
  /* RRULE expansion — daily/weekly/monthly/yearly with INTERVAL, BYDAY, UNTIL, COUNT */
  var RRDOW={SU:0,MO:1,TU:2,WE:3,TH:4,FR:5,SA:6};
  function monthsBetween(a,b){ return (+b.slice(0,4)-+a.slice(0,4))*12+(+b.slice(5,7)-+a.slice(5,7)); }
  function occurrenceDates(e){
    var r={}; String(e.rrule).split(";").forEach(function(p){ var kv=p.split("="); if(kv.length===2) r[kv[0].toUpperCase()]=kv[1]; });
    var freq=r.FREQ; if(!freq) return [e.date];
    var interval=Math.max(1,+r.INTERVAL||1);
    var until=null; if(r.UNTIL){ var u=r.UNTIL.replace(/[^0-9]/g,""); if(u.length>=8) until=u.slice(0,4)+"-"+u.slice(4,6)+"-"+u.slice(6,8); }
    var count=+r.COUNT||null;
    var byday=r.BYDAY? r.BYDAY.split(",").map(function(x){ return RRDOW[x.slice(-2)]; }).filter(function(x){ return x!==undefined; }) : null;
    var winStart=addDays(today(),-60), winEnd=addDays(today(),365);
    if(until&&until<winEnd) winEnd=until;
    var start=e.date, startDow=dow(start), ws=addDays(start,-((startDow+6)%7));
    var out=[], n=0, day=start, guard=0;
    while(day<=winEnd && guard++<3200){
      var hit=false;
      if(freq==="DAILY") hit=diffDays(day,start)%interval===0;
      else if(freq==="WEEKLY") hit=(Math.floor(diffDays(day,ws)/7)%interval===0)&&(byday?byday.indexOf(dow(day))>=0:dow(day)===startDow);
      else if(freq==="MONTHLY") hit=day.slice(8)===start.slice(8)&&(monthsBetween(start,day)%interval===0);
      else if(freq==="YEARLY") hit=day.slice(5)===start.slice(5)&&((+day.slice(0,4)-+start.slice(0,4))%interval===0);
      if(hit){ n++; if(count&&n>count) break; if(day>=winStart) out.push(day); if(out.length>=500) break; }
      day=addDays(day,1);
    }
    return out;
  }
  function expandEvents(evs){
    var out=[];
    evs.forEach(function(e){
      if(!e.rrule){ out.push(e); return; }
      occurrenceDates(e).forEach(function(d){ out.push({title:e.title,uid:(e.uid||"ev")+"@"+d,date:d}); });
    });
    return out;
  }
  function sourceEnabled(ev){ if(!ev.sourceId) return true; var s=S.calSources.find(function(x){return x.id===ev.sourceId;}); return s?s.enabled!==false:true; }
  function refreshCalendars(cb){
    var list=S.calSources.filter(function(s){return s.enabled&&s.url;});
    if(!list.length){ if(cb)cb(); return; }
    var pending=list.length;
    list.forEach(function(s){
      var target=s.url.replace(/^webcal:/i,"https:");
      var url=s.useProxy?(S.proxy+encodeURIComponent(target)):target;
      fetch(url).then(function(r){ if(!r.ok) throw 0; return r.text(); }).then(function(txt){
        S.events=S.events.filter(function(e){return e.sourceId!==s.id;});
        var evs=expandEvents(parseEvents(txt)); evs.forEach(function(e){ S.events.push({id:uid(),uid:e.uid,title:e.title||"(event)",date:e.date,sourceId:s.id,color:s.color}); });
        s.count=evs.length; s.lastSync=Date.now(); s.error=null;
      }).catch(function(){ s.error="Couldn't fetch — the calendar host likely blocks browser access. Turn on the proxy option, or import the .ics file instead."; })
      .then(function(){ if(--pending===0){ save(); if(cb)cb(); } });
    });
  }

  /* ---------- optional cloud sync via a GitHub gist (free, no server) ---------- */
  var GH_KEY="gena-gh", GH_FILE="daybook.json", GH_DESC="Gena sync";   // gist filename kept: renaming it would orphan existing sync gists
  var GH=null, ghTimer=null, ghLastSync=null, ghError=null, ghBusy=false, ghDirty=false, ghEmptyWarned=false;
  try{ GH=JSON.parse(localStorage.getItem(GH_KEY))||null; }catch(e){ GH=null; }
  function ghSaveCfg(){ if(GH&&GH.token) localStorage.setItem(GH_KEY,JSON.stringify(GH)); else localStorage.removeItem(GH_KEY); }
  function ghApi(method,path,body){
    return fetch("https://api.github.com"+path,{method:method,
      headers:{Authorization:"Bearer "+GH.token,Accept:"application/vnd.github+json"},
      body:body?JSON.stringify(body):undefined
    }).then(function(r){ if(!r.ok) throw new Error("GitHub replied "+r.status); return r.status===204?null:r.json(); });
  }
  function scheduleGh(){ if(!GH||!GH.token||!GH.gistId) return; ghDirty=true; clearTimeout(ghTimer); ghTimer=setTimeout(function(){ ghSync("auto"); },2500); }
  // ghPull/ghPush are kept as thin aliases so existing callers keep working.
  function ghPull(){ ghSync("pull"); }
  function ghPush(){ ghSync("push"); }
  // One reconciliation cycle: fetch cloud, merge item-by-item (newest edit wins, no whole-file clobber), push the union back.
  var ghSyncing=false;
  function ghSync(reason){
    if(!GH||!GH.token||!GH.gistId) return;
    if(ghSyncing){ ghDirty=true; return; }               // a cycle is mid-flight; it'll pick up the latest S
    ghSyncing=true; ghBusy=true; updateSyncStatus();
    ghFetchData(function(cloud,err){
      var done=function(){ ghSyncing=false; ghBusy=false; updateSyncStatus(); };
      if(err){ ghError=err; done(); return; }             // couldn't read the cloud — never overwrite blindly, retry later
      ghError=null;
      if(!cloud){ doGhPush(done); return; }               // no cloud file yet -> create it from this device
      var merged=mergeStates(S,cloud);
      var localChanged=stateSig(merged)!==stateSig(S);
      var cloudChanged=stateSig(merged)!==stateSig(cloud);
      S=normalize(merged); baseState=clone(S); persist();
      if(localChanged){ applyTheme(); fillProjSelect(); render(); if(reason!=="auto") toast("Synced — merged changes from the cloud"); }
      ghLastSync=Date.now();
      if(cloudChanged){ doGhPush(done); } else { ghDirty=false; done(); }
    });
  }
  function doGhPush(after){
    (ENC?encString(JSON.stringify(S)):Promise.resolve(JSON.stringify(S))).then(function(content){
    var files={"daybook.json":{content:content}};
    // the reminder feed is plaintext by nature — with a passcode on, it stays off the cloud
    if(!ENC){ try{ files["daybook.ics"]={content:buildICS(true)}; }catch(e){} }
    return ghApi("PATCH","/gists/"+GH.gistId,{files:files}); })
      .then(function(){ ghLastSync=Date.now(); ghError=null; ghDirty=false; })
      .catch(function(e){ ghError=e.message; })
      .then(function(){ if(after) after(); else { ghBusy=false; updateSyncStatus(); } });
  }
  function ghFetchData(cb){
    ghApi("GET","/gists/"+GH.gistId).then(function(g){
      var f=g&&g.files&&g.files[GH_FILE];
      if(!f){ cb(null); return; }                          // gist exists but no data file yet -> safe to create
      if(f.truncated){ fetch(f.raw_url).then(function(r){return r.text();}).then(function(t){ resolveGh(t,cb); }).catch(function(){ cb(null,"Couldn't read cloud data"); }); }
      else resolveGh(f.content,cb);
    }).catch(function(e){ cb(null,e.message); });           // network/API error -> signal so we don't clobber
  }
  function parseGh(t){ try{ var d=JSON.parse(t); return (d&&d.version)?d:null; }catch(e){ return null; } }
  // cloud text may be an envelope: decrypt with the unlocked key, or say clearly why not
  function resolveGh(t,cb){ var e=EC.isEnv(t);
    if(!e){ cb(parseGh(t)); return; }
    if(!ENC){ cb(null,"Cloud data is encrypted — turn on the same passcode on this device first"); return; }
    EC.decrypt(ENC.key,e).then(function(pt){ cb(parseGh(pt)); }).catch(function(){ cb(null,"Cloud data was encrypted with a different passcode"); }); }

  /* ---------- menu: backup / import / help ---------- */
  function mergeData(inc){
    var added=0;
    ["projects","tasks","templates","routines","habits","events","phases","people","emails","jobs","improve","calSources","profiles","archive"].forEach(function(key){
      var have={}; S[key].forEach(function(x){ if(x&&x.id) have[x.id]=1; });
      (inc[key]||[]).forEach(function(x){ if(x&&x.id&&!have[x.id]){ S[key].push(x); added++; } });
    });
    Object.keys(inc.notes||{}).forEach(function(k){ if(!S.notes[k]){ S.notes[k]=inc.notes[k]; added++; } });
    Object.keys(inc.focus||{}).forEach(function(k){ if(!(S.focus[k]&&S.focus[k].length)){ S.focus[k]=inc.focus[k]; added++; } });
    Object.keys(inc.habitLog||{}).forEach(function(k){ if(!S.habitLog[k]){ S.habitLog[k]=inc.habitLog[k]; added++; } });
    (inc.dismissed||[]).forEach(function(x){ if(S.dismissed.indexOf(x)<0) S.dismissed.push(x); });
    return added;
  }

  /* ---------- share a read-only snapshot (Phase 6) ---------- */
  function b64urlEncode(str){ return btoa(unescape(encodeURIComponent(str))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
  function b64urlDecode(str){ str=str.replace(/-/g,"+").replace(/_/g,"/"); while(str.length%4)str+="="; try{ return decodeURIComponent(escape(atob(str))); }catch(e){ return null; } }
  function buildSnapshot(scope){
    var t=today();
    var days = scope==="week" ? (function(){ var a=[]; for(var i=0;i<7;i++)a.push(addDays(t,i)); return a; })() : [t];
    var inRange=function(d){ return days.indexOf(d)>=0; };
    var snap={ n:S.name||"", d:t, scope:scope, tasks:[], focus:[], events:[] };
    orderTasks(S.tasks.filter(function(k){ return k.day && inRange(k.day) && inScope(k.projectId); }),false).forEach(function(k){
      var p=k.projectId?proj(k.projectId):null;
      snap.tasks.push({t:k.title, d:k.day, b:k.block||null, at:k.at||null, p:k.priority?1:0, done:k.status==="done"?1:0, s:(k.subs||[]).map(function(s){return {t:s.text,done:s.done?1:0};}), pr:p?p.name:null });
    });
    (S.focus[t]||[]).forEach(function(f){ var txt=f.taskId?(S.tasks.find(function(x){return x.id===f.taskId;})||{}).title:f.text; if(txt) snap.focus.push({t:txt, done:f.done?1:0}); });

  function renderSnapshotView(snap){
    var esc2=function(s){ return (s||"").replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); };
    var BLK={morning:"☀️",afternoon:"🌤",evening:"🌙"};
    var byDay={}; (snap.tasks||[]).forEach(function(k){ (byDay[k.d]=byDay[k.d]||[]).push(k); });
    var dates=Object.keys(byDay).sort();
    var niceD=function(s){ try{ var p=s.split("-"); var d=new Date(+p[0],+p[1]-1,+p[2]); return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()]+", "+["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()]+" "+d.getDate(); }catch(e){ return s; } };
    var taskHtml=function(k){
      var subs=(k.s||[]).map(function(s){ return '<li class="snap-sub'+(s.done?" done":"")+'">'+(s.done?"✓ ":"○ ")+esc2(s.t)+'</li>'; }).join("");
      var meta=[]; if(k.at)meta.push("🕒 "+k.at); if(k.b&&BLK[k.b])meta.push(BLK[k.b]+" "+k.b); if(k.pr)meta.push(esc2(k.pr)); if(k.p)meta.push("★");
      return '<li class="snap-task'+(k.done?" done":"")+'"><div>'+(k.done?"✓ ":"○ ")+esc2(k.t)+'</div>'+(meta.length?'<div class="snap-meta">'+meta.join(" · ")+'</div>':"")+(subs?'<ul class="snap-subs">'+subs+'</ul>':"")+'</li>';
    };
    var body='<div class="snap-wrap"><div class="snap-banner">🔗 Shared read-only snapshot'+(snap.n?" from "+esc2(snap.n):"")+' · <a href="'+esc2(location.pathname)+'">Open your own Gena →</a></div>'+
      '<h1 class="snap-h1">📔 '+(snap.scope==="week"?"This week":"Today")+(snap.d?' · '+niceD(snap.d):"")+'</h1>';
    if((snap.focus||[]).length){ body+='<div class="snap-card"><h2>⭐ Focus</h2><ul class="snap-list">'+snap.focus.map(function(f){return '<li class="snap-task'+(f.done?" done":"")+'">'+(f.done?"✓ ":"○ ")+esc2(f.t)+'</li>';}).join("")+'</ul></div>'; }
    if(!dates.length){ body+='<div class="snap-card"><p style="opacity:.6">No tasks in this snapshot.</p></div>'; }
    dates.forEach(function(d){ body+='<div class="snap-card"><h2>'+niceD(d)+'</h2><ul class="snap-list">'+byDay[d].map(taskHtml).join("")+'</ul></div>'; });
    if((snap.events||[]).length){ body+='<div class="snap-card"><h2>📅 Events</h2><ul class="snap-list">'+snap.events.map(function(e){return '<li class="snap-task">'+esc2(e.t)+' <span class="snap-meta">· '+niceD(e.d)+'</span></li>';}).join("")+'</ul></div>'; }

    document.body.innerHTML=body;
    document.body.setAttribute("data-snapshot","1");
  }

  /* ---------- PEOPLE (follow-ups) ---------- */
  function relatedTasks(person){
    var terms=[norm(person.name)];
    norm(person.name).split(/\s+/).forEach(function(w){ w=w.replace(/[^\w]/g,""); if(w.length>=4) terms.push(w); });
    terms=terms.filter(Boolean);
    // An explicit personIds tag is the real link. Name-matching stays as a fallback so tasks written
    // before tagging existed (or just typed with someone's name in them) still surface here.
    var tagged={}, out=[];
    S.tasks.forEach(function(k){ if(k.status==="done") return;
      if((k.personIds||[]).indexOf(person.id)>=0){ tagged[k.id]=1; out.push(k); } });
    S.tasks.forEach(function(k){ if(k.status==="done"||tagged[k.id]) return;
      if((k.personIds||[]).length) return;                       // tagged elsewhere -> don't guess
      var t=norm(k.title+" "+htmlToText(k.notes));
      if(terms.some(function(tm){ return t.indexOf(tm)>=0; })) out.push(k); });
    return out;
  }
  function personById(id){ return S.people.find(function(x){return x.id===id;}); }
  // person chips for a task row, so a tagged task reads the same everywhere it appears

  /* Best-effort parse of whatever a mail app hands over on drop: an .eml file (RFC 822 headers), a
     text/plain body that begins with headers, an HTML fragment, a mailto:/message: URL, or plain
     "Subject — Sender". Returns {subject, sender, date, note} or null. */
  function parseDroppedEmail(kind, text){
    text=String(text||""); if(!text.trim()) return null;
    var out={subject:"",sender:"",date:"",note:""};
    var hdr=function(name){ var m=text.match(new RegExp("^"+name+":\\s*(.+)$","im")); return m?m[1].replace(/\s+/g," ").trim():""; };
    if(/^(from|subject|date|to):/im.test(text)){                       // headers present (.eml, or a pasted source)
      out.subject=hdr("subject"); out.sender=hdr("from"); out.date=hdr("date");
      var body=text.split(/\r?\n\r?\n/).slice(1).join("\n").replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();
      out.note=body.slice(0,240);
    } else if(kind==="text/html"){
      var doc=document.implementation.createHTMLDocument("");
      doc.body.innerHTML=text;
      var t=(doc.querySelector("title")||{}).textContent||"", plain=(doc.body.textContent||"").replace(/\s+/g," ").trim();
      out.subject=(t||plain.split(/[.!?]\s/)[0]).slice(0,120); out.note=plain.slice(0,240);
    } else if(/^(mailto|message|outlook|googlegmail):/i.test(text.trim())){
      var u=text.trim(); var sm=u.match(/subject=([^&]+)/i); out.subject=sm?decodeURIComponent(sm[1].replace(/\+/g," ")):"Email"; out.note=u;
    } else {
      var lines=text.split(/\r?\n/).map(function(l){return l.trim();}).filter(Boolean);
      var first=lines[0]||""; var parts=first.split(/\s[—–-]\s/);
      out.subject=parts[0].slice(0,120); out.sender=(parts[1]||"").slice(0,80); out.note=lines.slice(1).join(" ").slice(0,240);
    }
    // "Name <addr>" → Name; a bare address stays
    out.sender=out.sender.replace(/^"?([^"<]+)"?\s*<[^>]+>$/,"$1").trim();
    if(out.date){ var dd=new Date(out.date); if(!isNaN(dd)) out.date=fmt(dd); else out.date=""; }
    if(!out.subject) out.subject=out.note.slice(0,80)||"Email";
    return out;
  }
  function addDroppedEmail(parsed){
    if(!parsed) return false;
    S.emails.unshift({id:uid(),subject:parsed.subject,sender:parsed.sender,date:parsed.date||"",note:parsed.note||"",done:false,created:today()});
    save(); render(); toast("Flagged: "+parsed.subject.slice(0,40)); return true;
  }
  function addEmails(text){ text=(text||"").trim(); if(!text)return; text.split(/\n/).forEach(function(line){ line=line.trim(); if(!line)return; var parts=line.split(/\s[—–-]\s/); S.emails.unshift({id:uid(),subject:parts[0].trim(),sender:(parts[1]||"").trim(),done:false,created:today()}); }); save(); render(); toast("Flagged"); }
  function addImprove(type,text){ text=(text||"").trim(); if(!text)return; S.improve.unshift({id:uid(),type:type||"idea",text:text,date:today()}); save(); render(); }
  // Only the open items travel, numbered — so a session never has to diff the whole log against the
  // roadmap again, and the numbers come back as "SHIPPED: 1,4" for one-tap bookkeeping.
  function copyImprove(){
    var openL=S.improve.filter(function(e){return e.status!=="shipped";});

  function parseTimeAI(s){ if(!s) return null; s=String(s).trim().toLowerCase();
    var m=s.match(/^(\d{1,2}):(\d{2})$/); if(m){ var h=+m[1]; if(h<=23&&+m[2]<=59) return String(h).padStart(2,"0")+":"+m[2]; }
    m=s.match(/^(\d{1,2})(?::(\d{2}))?\s*(am|pm)$/); if(m){ var h2=+m[1]%12; if(m[3]==="pm")h2+=12; return String(h2).padStart(2,"0")+":"+(m[2]||"00"); }
    return null;
  }
  function extractJSON(text){
    if(!text) return null;
    var m=text.match(/```(?:json)?\s*([\s\S]*?)```/i); var raw=m?m[1]:text; raw=raw.trim();
    if(!m){ var s=raw.indexOf("{"), e=raw.lastIndexOf("}"); if(s>=0&&e>s) raw=raw.slice(s,e+1); }
    try{ return JSON.parse(raw); }catch(err){ return null; }
  }
  function previewAIImport(text){

    function subCount(a){ var s=arr(a).filter(Boolean); return s.length?" · "+s.length+" subtask"+(s.length===1?"":"s"):""; }
    arr(d.profiles).forEach(function(p){ if(p&&p.name) items.push("<b>Profile:</b> "+esc(String(p.emoji||""))+" "+esc(String(p.name))); });
    arr(d.projects).forEach(function(p){ if(p&&p.name) items.push("<b>Project:</b> "+esc(String(p.name))+(p.profile?" · "+esc(String(p.profile)):"")); });
    if(d.focusToday) items.push("<b>Focus:</b> "+esc(String(d.focusToday)));
    arr(d.focus).forEach(function(f){ var txt=(typeof f==="string")?f:(f&&f.text); if(txt) items.push("<b>Focus:</b> "+esc(String(txt))+subCount(f&&f.subtasks)); });
    arr(d.tasks).forEach(function(k){ if(k&&k.title){ var meta="";
      var hasDay=("day" in k)&&k.day!=null&&k.day!==""&&String(k.day).toLowerCase()!=="someday";
      meta+=hasDay?(validDate(k.day)?" · "+niceDate(k.day):""):" · someday";
      if(k.block&&k.block!=="anytime") meta+=" · "+k.block;
      if(parseTimeAI(k.time)) meta+=" · 🕒 "+k.time;
      if(k.priority) meta+=" · ★";
      meta+=subCount(k.subtasks);
      if(k.notes) meta+=" · 📝";
      items.push("<b>Task:</b> "+esc(String(k.title))+meta); } });
    arr(d.events).forEach(function(ev){ if(ev&&ev.title&&validDate(ev.date)) items.push("<b>Event:</b> "+esc(String(ev.title))+" · "+niceDate(ev.date)); });
    arr(d.jobs).forEach(function(j){ if(j&&j.company) items.push("<b>Job:</b> "+esc(String(j.company))+(j.role?" — "+esc(String(j.role)):"")); });
    arr(d.emails).forEach(function(e){ if(e&&e.subject) items.push("<b>Email:</b> "+esc(String(e.subject))); });
    arr(d.notes).forEach(function(nt){ if(nt) items.push("<b>Note:</b> "+esc(String(nt).slice(0,80))+(String(nt).length>80?"…":"")); });
    arr(d.updates).forEach(function(u){ if(!u||!u.id)return; var k=S.tasks.find(function(x){return x.id===u.id;}); if(!k)return;
      var ch=[]; if(u.done===true)ch.push("✓ done"); if(u.done===false)ch.push("reopen"); if("day" in u)ch.push("→ "+(u.day&&validDate(u.day)?niceDate(u.day):"someday")); if(u.block)ch.push(u.block); if(parseTimeAI(u.time))ch.push("🕒 "+u.time); if(u.priority===true)ch.push("★"); if(u.priority===false)ch.push("unstar"); if(u.title)ch.push("rename"); if(u.notes)ch.push("note");
      items.push('<b>Update:</b> '+esc(k.title.slice(0,40))+" — "+esc(ch.join(", ")||"(no change)")); });
    arr(d.deletes).forEach(function(id){ var k=S.tasks.find(function(x){return x.id===id;}); if(k) items.push('<b>Delete:</b> '+esc(k.title.slice(0,50))); });
    if(!items.length){ toast("Nothing to import in that reply"); return; }
    modal('<h3>Import from Claude</h3><p class="sub">'+items.length+' item'+(items.length===1?"":"s")+' will be added. Nothing changes until you confirm.</p>'+
      '<div class="card" style="font-size:13.5px;line-height:1.7;max-height:45vh;overflow:auto">'+items.map(function(c){return "• "+c;}).join("<br>")+'</div>'+
      '<div class="modal-actions"><button class="btn ghost" data-x>Cancel</button><button class="btn primary" id="ai-go">Add it all</button></div>');

  function profByName(name){ if(!name)return null; var pr=S.profiles.find(function(x){return x.name.toLowerCase()===String(name).toLowerCase();}); if(!pr){ pr={id:uid(),name:String(name),emoji:"📁"}; S.profiles.push(pr); } return pr; }
  function projByName(name, profileName){ if(!name)return null; var p=S.projects.find(function(x){return x.name.toLowerCase()===String(name).toLowerCase();}); if(!p){ p={id:uid(),name:String(name),color:COLORS[S.projects.length%COLORS.length],notes:"",profileId:null,fav:false}; S.projects.push(p); } if(profileName){ var pr=profByName(profileName); if(pr) p.profileId=pr.id; } return p; }
  function validDate(s){ return (typeof s==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(s))?s:null; }
  function aiSubs(a){ return (Array.isArray(a)?a:[]).filter(Boolean).map(function(s){ return {id:uid(),text:String(typeof s==="string"?s:(s.text||"")),done:false}; }).filter(function(s){return s.text.trim();}); }
  function applyAIImport(d){
    var t=today(), n=0;
    (d.profiles||[]).forEach(function(pr){ if(pr&&pr.name){ var x=profByName(pr.name); if(pr.emoji) x.emoji=String(pr.emoji); n++; } });
    (d.projects||[]).forEach(function(p){ if(p&&p.name){ projByName(p.name, p.profile); n++; } });
    if(d.focusToday){ S.focus[t]=S.focus[t]||[]; S.focus[t].push({id:uid(),text:String(d.focusToday),done:false,subs:[]}); n++; }
    (Array.isArray(d.focus)?d.focus:[]).forEach(function(f){ if(!f)return; var txt=(typeof f==="string")?f:f.text; if(!txt)return;
      var fpid=(f&&f.project)?projByName(f.project,f.profile).id:null;
      S.focus[t]=S.focus[t]||[]; S.focus[t].push({id:uid(),text:String(txt),projectId:fpid,done:false,subs:aiSubs(f.subtasks)}); n++; });
    (d.tasks||[]).forEach(function(k){ if(!k||!k.title)return;
      var pid=k.project?projByName(k.project,k.profile).id:null;
      var bl=["morning","afternoon","evening"].indexOf(k.block)>=0?k.block:null;
      var dayVal; if(!("day" in k)||k.day==null||k.day===""||String(k.day).toLowerCase()==="someday") dayVal=null; else dayVal=validDate(k.day)||t;
      var dueVal=validDate(k.due)||null, endVal=validDate(k.end)||null;
      var at=parseTimeAI(k.time); if(at&&!bl) bl=blockForTime(at);
      S.tasks.push({id:uid(),title:String(k.title),projectId:pid,status:"todo",day:dayVal,block:bl,at:at,priority:!!k.priority,rollover:0,due:dueVal,end:(endVal&&dayVal&&endVal>dayVal)?endVal:null,notes:k.notes?plainToHtml(String(k.notes)):null,subs:aiSubs(k.subtasks),created:t}); n++; });
    (d.phases||[]).forEach(function(ph){ if(!ph||!ph.title||!validDate(ph.start)||!validDate(ph.end))return;
      var ppid=ph.project?projByName(ph.project,ph.profile).id:null;
      if(ph.end<ph.start) return;
      S.phases.push({id:uid(),projectId:ppid,title:String(ph.title),start:ph.start,end:ph.end}); n++; });
    (d.events||[]).forEach(function(ev){ if(!ev||!ev.title||!validDate(ev.date))return; var pid=ev.project?projByName(ev.project,ev.profile).id:null; S.events.push({id:uid(),title:String(ev.title),date:validDate(ev.date),projectId:pid,source:"ai"}); n++; });
    (d.jobs||[]).forEach(function(j){ if(!j||!j.company)return; var st=JOB_STAGES.indexOf(j.stage)>=0?j.stage:"Saved"; S.jobs.push({id:uid(),company:String(j.company),role:j.role||"",stage:st,next:j.next||"",nextDate:validDate(j.nextDate),link:j.link||"",notes:j.notes||"",checklist:aiSubs(j.checklist).map(function(s){return {id:s.id,text:s.text,done:false};})}); n++; });
    (d.emails||[]).forEach(function(e){ if(!e||!e.subject)return; S.emails.unshift({id:uid(),subject:String(e.subject),sender:e.sender||"",done:false,created:t}); n++; });
    (d.notes||[]).forEach(function(nt){ if(!nt)return; S.notes[t]=(S.notes[t]?S.notes[t]+"<br>":"")+plainToHtml(String(nt)); n++; });
    // ---- edits to EXISTING tasks (Phase 5: let Claude update my plan) ----
    (d.updates||[]).forEach(function(u){ if(!u||!u.id)return; var k=S.tasks.find(function(x){return x.id===u.id;}); if(!k)return;
      if(u.done===true && isOpen(k)){ k.status="done"; k.completedOn=t; }
      if(u.done===false && k.status==="done"){ k.status="todo"; k.completedOn=null; }
      if("day" in u){ if(u.day===null||String(u.day).toLowerCase()==="someday") k.day=null; else if(validDate(u.day)){ k.day=u.day; k.rollover=0; } }
      if(["morning","afternoon","evening"].indexOf(u.block)>=0) k.block=u.block;
      if(parseTimeAI(u.time)){ k.at=parseTimeAI(u.time); if(!k.block) k.block=blockForTime(k.at); }
      if(typeof u.priority==="boolean") k.priority=u.priority;
      if(u.title) k.title=String(u.title);
      if(u.notes) k.notes=plainToHtml(String(u.notes));
      if("due" in u){ if(u.due===null||u.due==="") k.due=null; else if(validDate(u.due)) k.due=u.due; }
      if("end" in u){ if(u.end===null||u.end==="") k.end=null; else if(validDate(u.end)) k.end=u.end; }
      n++; });
    (d.deletes||[]).forEach(function(id){ var i=S.tasks.findIndex(function(x){return x.id===id;}); if(i>=0){ S.tasks.splice(i,1); n++; } });
    ensureOrd(); fillProjSelect(); save(); toast("Applied "+n+" change"+(n===1?"":"s")+" from Claude");
  }

      S.projects.forEach(function(p){ if(rows.length<40 && (norm(p.name)+" "+norm(p.notes)).indexOf(q)>=0) rows.push(row("project",p.id,p.name,"")); });

      Object.keys(S.notes).forEach(function(dk){ if(rows.length<40 && norm(S.notes[dk]).indexOf(q)>=0) rows.push(row("note",dk,S.notes[dk].slice(0,70),niceDate(dk))); });

    out.onclick=function(e){ var r=e.target.closest(".srch-row"); if(!r)return; var kind=r.dataset.kind, key=r.dataset.key;

        if(ak){ close(); confirmModal("Bring “"+ak.title.slice(0,40)+"” back?","It returns to your To-do as an open task for today.","Restore",function(){
          S.archive=S.archive.filter(function(x){return x.id!==ak.id;});

  function openPalette(){
    modal('<div class="fld" style="margin:0"><input id="pal-in" placeholder="Type a command, or search open tasks…" aria-label="Command palette"/></div>'+
      '<div id="pal-res" style="margin-top:10px;max-height:52vh;overflow:auto"></div>'+
      '<div class="sub" style="font-size:10.5px;margin:10px 0 0">↑↓ to choose · Enter to run · Esc to close</div>');
    var inp=document.getElementById("pal-in"), out=document.getElementById("pal-res");
    var items=[], idx=0;
    function paint(){
      out.innerHTML=items.length?items.map(function(it,i){
        return '<div class="srch-row pal-row'+(i===idx?" sel":"")+'" data-i="'+i+'"><span>'+it.icon+'</span><span style="flex:1">'+esc(it.label)+'</span>'+(it.hint?'<span class="ac-hint">'+esc(it.hint)+'</span>':"")+'</div>';
      }).join(""):'<div class="empty">No matches</div>';
      var sel=out.querySelector(".sel"); if(sel&&sel.scrollIntoView) sel.scrollIntoView({block:"nearest"});
    }
    function build(q){
      q=norm(q);
      var res=paletteActions().filter(function(it){ return !q||norm(it.label).indexOf(q)>=0; });
      if(q.length>=2){
        S.tasks.forEach(function(k){
          if(res.length>=16||k.status==="done") return;
          if(norm(k.title+" "+htmlToText(k.notes)+" "+(k.subs||[]).map(function(s){return s.text;}).join(" ")).indexOf(q)>=0){
            res.push({icon:"☐",label:k.title,hint:k.day?niceDate(k.day):"someday",run:function(){ openTaskModal({edit:k}); }});
          }
        });
      }
      items=res.slice(0,16); idx=0; paint();
    }
    inp.oninput=function(){ build(inp.value); };
    inp.onkeydown=function(e){
      if(e.key==="ArrowDown"){ e.preventDefault(); if(items.length){ idx=(idx+1)%items.length; paint(); } }
      else if(e.key==="ArrowUp"){ e.preventDefault(); if(items.length){ idx=(idx-1+items.length)%items.length; paint(); } }
      else if(e.key==="Enter"){ e.preventDefault(); var it=items[idx]; if(it){ close(); it.run(); } }
    };
    out.onclick=function(e){ var r=e.target.closest(".pal-row"); if(!r) return; var it=items[+r.dataset.i]; close(); if(it) it.run(); };
    build("");
  }

  /* ---------- recurring edit scope (Phase 21) ----------
     Editing one instance of a repeat asks the Outlook question first, so a small tweak to today doesn't
     silently rewrite months of a series (or vice versa). */
  function askRecurScope(task, cb){
    var tp=task.tplId?S.templates.find(function(x){return x.id===task.tplId;}):null;
    if(!tp) return cb("one");
    modal('<h3>↻ This task repeats</h3><p class="sub">“'+esc(task.title)+'” is part of a repeating series. What should the change apply to?</p>'+
      '<div class="stack">'+
        '<button class="btn" data-scope="one">Just this one — '+esc(niceDate(task.day))+'</button>'+
        '<button class="btn" data-scope="future">This and all future ones</button>'+
        '<button class="btn" data-scope="all">Every one in the series</button>'+
      '</div><div class="modal-actions"><button class="btn ghost" data-x>Cancel</button></div>');
    document.querySelector("[data-x]").onclick=close;
    document.querySelector(".modal").onclick=function(e){
      var b=e.target.closest("[data-scope]"); if(!b) return;
      var sc=b.dataset.scope; close(); cb(sc);
    };
  }
  // Detach one instance from its series so edits to it stay local.
  function detachInstance(task){
    var tp=S.templates.find(function(x){return x.id===task.tplId;});
    if(tp){ tp.skip=(tp.skip||[]); if(tp.skip.indexOf(task.day)<0) tp.skip.push(task.day); }
    delete task.tplId;
  }
  // End the series the day before this instance, and re-point the rest at a fresh template.
  function splitSeriesAt(task){
    var tp=S.templates.find(function(x){return x.id===task.tplId;});
    if(!tp) return null;
    var fresh={}; for(var k in tp) fresh[k]=tp[k];
    fresh.id=uid(); fresh.start=task.day; fresh.until=tp.until||null; fresh.skip=[];
    tp.until=addDays(task.day,-1);
    S.templates.push(fresh);
    S.tasks.forEach(function(x){ if(x.tplId===tp.id && x.day>=task.day) x.tplId=fresh.id; });
    return fresh;
  }
  /* ---------- day-start review (Phase 22) ----------
     First open of a new day: everything still open from before, shown with WHERE it lived, so you can
     tick off what actually got done and pull the rest forward without hunting through cards. */
  function whereWasIt(k,fromDay){
    var inF=Object.keys(S.focus||{}).some(function(d){ return d<today() && (S.focus[d]||[]).some(function(f){return f.taskId===k.id;}); });
    if(inF) return {label:"Focus",cls:"imp"};
    if(k.block) return {label:k.block,cls:"block"};
    if(!k.day) return {label:"Backlog",cls:"block"};
    return {label:"To-do",cls:"block"};
  }
  /* ---------- review — celebrate, clear, choose ----------
     One component, two scopes. "week" is the sweep; "day" runs on the first open of a new day. They
     differ in what they count and which tasks they pull in, not in shape — the weekly one was the one
     worth keeping, so the daily review is now the same thing scoped to a day, and the weekly one picked
     up the daily one's project grouping and where-it-lived pills. Actions apply immediately and the
     modal redraws, which is what makes it feel like clearing rather than filling in a form. */
  function fmtMins(m){ var h=Math.floor(m/60), r=m%60; return h?(h+"h"+(r?" "+r+"m":"")):(m+"m"); }
  // The next occurrence of a weekday, always strictly ahead — "next Monday" on a Monday means the one
  // coming, not today.
  function nextDow(n){ var d=addDays(today(),1); while(dow(d)!==n) d=addDays(d,1); return d; }
  // Buttons carry the real weekday and date, so "end of week" can't be misread.
  function reviewPicks(){
    var eow=nextDow(0), nw=nextDow(1);          // Sunday closes the week; Monday opens the next one
    // The three that answer almost every row come first — they are the three questions a review asks:
    // did you do it, are you letting it go, or is it tomorrow's problem. Everything else folds.
    return [["done","✓ Did it",null],
            ["skip","⤬ Skipped",null],
            ["tomorrow","→ Tomorrow",addDays(today(),1)],
            ["wait","⏸ Waiting",null],
            ["today","📅 Today",today()],
            ["eow","🌤 "+DOWNAMES[dow(eow)]+" "+(+eow.slice(8)),eow],
            ["nextweek","⏭ "+DOWNAMES[dow(nw)]+" "+(+nw.slice(8)),nw],
            ["someday","💭 Someday",null],
            ["drop","✕ Drop",null]];
  }
  var REVIEW_SCOPES=[["morning","🌅","Loose ends"],["evening","🌙","Today"],["week","🧹","This week"]];
  function rvGroupMode(){ return S.rvGroup||"project"; }
  // Three ways to look at the same loose ends: by project (what it belongs to), by where it was
  // (Focus, To-do, a block — the "Anytime vs To-do" question), or flat when there are only a few.
  function reviewGroups(list,fromDay){
    var mode=rvGroupMode();
    if(mode==="none") return [{id:"all",name:"Everything",color:"var(--ink-faint)",items:list}];
    if(mode==="where"){
      var ORDER=["Focus","To-do","morning","afternoon","evening","Backlog"], by={};
      list.forEach(function(k){ var w=whereWasIt(k,fromDay); (by[w.label]=by[w.label]||[]).push(k); });
      return Object.keys(by).sort(function(a,b){
        var ia=ORDER.indexOf(a), ib=ORDER.indexOf(b);
        return (ia<0?99:ia)-(ib<0?99:ib);
      }).map(function(lbl){ return {id:"where-"+lbl,name:lbl.charAt(0).toUpperCase()+lbl.slice(1),color:"var(--ink-faint)",items:by[lbl]}; });
    }
    return groupByProject(list);
  }
  // One gesture for "show me less". Walks every fold rendered right now (Today's cards, the panel,
  // Hub, project and people cards) and, when collapsing, pre-collapses the project/person cards of
  // views that aren't on screen too — so switching tabs doesn't undo the request.
  function setAllFolds(collapse){
    var keys={};
    document.querySelectorAll("details[data-fold]").forEach(function(d){ keys[d.dataset.fold]=1; });
    if(collapse){
      // Cards in views that aren't rendered right now still count as "all" — otherwise switching
      // tabs quietly undoes the request.
      ["focus","tasks","block-morning","block-afternoon","block-evening","habits","notes","sessions",
       "spu-course-plan","templates","routines","panel-sugg","panel-backlog","panel-carried","panel-done",
       "panel-log","hub-emails","hub-improve","hub-insights","hub-jobs"].forEach(function(k){ keys[k]=1; });
      S.projects.forEach(function(p){ keys["proj-"+p.id]=1; });
      S.people.forEach(function(p){ keys["person-"+p.id]=1; });
    }
    var n=0;
    Object.keys(keys).forEach(function(k){ S.collapsed[k]=!!collapse; n++; });
    save(); render();
    toast(collapse?"Collapsed "+n+" cards":"Expanded everything");
  }
  function anyFoldOpen(){ return [].some.call(document.querySelectorAll("details[data-fold]"),function(d){return d.open;}); }
  var rvHabitSkip={};   // habits marked "skipped" in this review — session-only, a skip is just a non-tick
  function openReviewModal(scope, fromDay, auto){
    scope=scope||"week"; rvHabitSkip={};
    var isEve=scope==="evening", isDay=(scope==="morning"||isEve), t=today();
    function looseEnds(){
      // morning: what was left behind (a span isn't a loose end while it's still running)
      // evening:  what is still open on today itself
      // week:     anything that has been carried at all
      if(isEve) return S.tasks.filter(function(k){ return k.status==="todo" && taskOnDay(k,t) && inScope(k.projectId); });
      // With carry-over on, yesterday's leftovers are already sitting on today — so a loose end is
      // anything still open that has been carried at all, wherever it now sits, plus anything that
      // never moved (carry-over off, or a day Gena wasn't opened).
      return scope==="morning"
        ? S.tasks.filter(function(k){ return isOpen(k) && k.day && !k.tplId && inScope(k.projectId) &&
            (lastDay(k.day,k.end)<t || (k.rollover||0)>=1 || !!k.carriedFrom); })
        : S.tasks.filter(function(k){ return k.status==="todo" && (k.rollover||0)>=1 && !k.tplId && inScope(k.projectId); });
    }
    if(auto && !looseEnds().length) return false;   // nothing to review — don't interrupt the day

    function tiles(){
      var out=[];
      if(isEve){
        out.push(["✅ "+S.tasks.filter(function(k){return k.completedOn===t;}).length,"done today"]);
        out.push(["🔥 "+doneStreak(),"day streak"]);
        var mt=focusMinutes(t);
        if(mt) out.push(["⏱ "+fmtMins(mt),"focused today"]);
        out.push(["🌙 "+looseEnds().length,"still open"]);
      } else if(isDay){
        var y=fromDay||addDays(t,-1), wasYesterday=(y===addDays(t,-1));
        out.push(["✅ "+S.tasks.filter(function(k){return k.completedOn===y;}).length,
                  "done "+(wasYesterday?"yesterday":"on "+niceDate(y))]);
        out.push(["🔥 "+doneStreak(),"day streak"]);
        var my=focusMinutes(y);
        if(my) out.push(["⏱ "+fmtMins(my),"focused "+(wasYesterday?"yesterday":"that day")]);
        out.push(["📅 "+S.tasks.filter(function(k){return k.status==="todo"&&taskOnDay(k,t)&&inScope(k.projectId);}).length,
                  "on today’s plate"]);
      } else {
        var wk=addDays(t,-6);
        var doneWk=S.tasks.filter(function(k){return k.completedOn&&k.completedOn>=wk;});
        var byDay={}; doneWk.forEach(function(k){ byDay[k.completedOn]=(byDay[k.completedOn]||0)+1; });
        var best=Object.keys(byDay).sort(function(a,b){return byDay[b]-byDay[a];})[0];
        out.push(["✅ "+doneWk.length,"done · last 7 days"]);
        out.push(["🔥 "+doneStreak(),"day streak"]);
        var mw=(S.sessions||[]).filter(function(x){return x.day>=wk;}).reduce(function(a,x){return a+(x.mins||0);},0);
        if(mw) out.push(["⏱ "+fmtMins(mw),"focused · last 7 days"]);
        if(best) out.push(["🏆 "+DOWNAMES[dow(best)],"best day · "+byDay[best]+" done"]);
      }
      return out;
    }
    function body(){
      var loose=looseEnds(), picks=reviewPicks().filter(function(m){ return !(isEve&&m[0]==="today"); });
      var someday=S.tasks.filter(function(k){ return !k.day && isOpen(k) && inScope(k.projectId); }).slice(0,6);
      var hr=new Date().getHours();
      var greet=hr<12?"Good morning":(hr<17?"Good afternoon":"Good evening");
      var h = isEve
        ? '<h3>🌙 Good evening'+(S.name?", "+esc(S.name):"")+' — how did today go?</h3>'+
          '<p class="sub">Tick off what you did, and decide where the rest goes.</p>'
        : scope==="morning"
        ? '<h3>🌅 '+greet+(S.name?", "+esc(S.name):"")+' — yesterday’s loose ends</h3>'+
          '<p class="sub">A minute: celebrate, clear, choose.'+(fromDay?' Last here '+esc(niceDate(fromDay))+'.':'')+'</p>'
        : '<h3>🧹 Weekly review</h3><p class="sub">Two minutes: celebrate, clear, choose.</p>';
      // flip between the three without closing — the same tasks, a different question
      h+='<div class="rv-tabs">'+REVIEW_SCOPES.map(function(x){
        return '<button class="chip" data-scope="'+x[0]+'" aria-pressed="'+(scope===x[0])+'">'+x[1]+' '+x[2]+'</button>'; }).join("")+'</div>';
      h+='<div class="ins-tiles" style="margin-top:6px">'+tiles().map(function(x){
        return '<div class="ins-tile"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>'; }).join("")+'</div>';

      if(scope==="morning" && loose.length>=4){
        // three proposals, three different reasons: the hard deadline, the oldest drag, the quick win
        var sg=[], used={};
        var byDue=loose.filter(function(k){return k.due;}).sort(function(a,b){return a.due.localeCompare(b.due);})[0];
        if(byDue){ sg.push({k:byDue,why:byDue.due<t?"overdue":"nearest deadline"}); used[byDue.id]=1; }
        var byCarry=loose.filter(function(k){return !used[k.id];}).sort(function(a,b){return (b.rollover||0)-(a.rollover||0);})[0];
        if(byCarry&&(byCarry.rollover||0)>=2){ sg.push({k:byCarry,why:"carried longest — "+byCarry.rollover+"d"}); used[byCarry.id]=1; }
        var byQuick=loose.filter(function(k){return !used[k.id]&&!(k.subs||[]).length;}).sort(function(a,b){return a.title.length-b.title.length;})[0];
        if(byQuick){ sg.push({k:byQuick,why:"a quick win"}); used[byQuick.id]=1; }
        if(sg.length>=2){
          h+='<div class="fld sg-box"><label>Suggested for today</label>'+
            sg.map(function(x){ return '<div class="sg-row"><div class="sg-title">'+esc(x.k.title)+'</div><span class="sg-why">'+esc(x.why)+'</span></div>'; }).join("")+
            '<div class="modal-actions" style="justify-content:flex-start;margin:8px 0 0">'+
            '<button class="btn primary" data-sg-accept="'+sg.map(function(x){return x.k.id;}).join(",")+'" style="padding:7px 14px">◎ Make these today’s focus</button></div></div>';

    function apply(k,m){
      if(m==="today") rescheduleTask(k,t);
      else if(m==="tomorrow") rescheduleTask(k,addDays(t,1));
      else if(m==="eow") rescheduleTask(k,nextDow(0));
      else if(m==="nextweek") rescheduleTask(k,nextDow(1));
      else if(m==="star"){ k.priority=!k.priority; }
      else if(m==="someday"){ k.day=null; k.end=null; k.block=null; k.rollover=0; delete k.carriedFrom; }
      else if(m==="done"){ k.status="done"; k.completedOn=k.completedOn||k.day||t; }
      else if(m==="skip"){ k.status="skipped"; k.skippedOn=k.day||t; }
      else if(m==="wait"){ parkTask(k,{}); }
      else if(m==="drop"){
        var i=S.tasks.indexOf(k); if(i<0) return;

        // dropping deletes a task outright, so it gets the same undo every other delete here has
        toastUndo("“"+k.title.slice(0,32)+"” dropped", function(){

    function wire(){
      var root=document.querySelector(".modal");

        if(e.target.closest("[data-x]")){ markReviewed(); close(); render(); return; }
        var gm=e.target.closest("[data-rvgroup]");
        if(gm){ S.rvGroup=gm.dataset.rvgroup; save(); rebuild(); return; }
        if(e.target.closest("[data-rvfoldall]")){
          var ds=[].slice.call(root.querySelectorAll("details[data-rvfold]"));

          save(); rebuild(); return; }
        var sc=e.target.closest("[data-scope]");
        if(sc){ markReviewed(); close(); openReviewModal(sc.dataset.scope, fromDay); return; }
        var all=e.target.closest("[data-all]");
        if(all){
          var hit=looseEnds();
          // one tap can move thirty tasks — keep the same escape hatch every single delete has
          var before=hit.map(function(k){ return {k:k, day:k.day, end:k.end, block:k.block, rollover:k.rollover,
            status:k.status, completedOn:k.completedOn, carriedFrom:k.carriedFrom, skippedOn:k.skippedOn, nextAt:k.nextAt, waitSince:k.waitSince}; });
          hit.forEach(function(k){ apply(k,all.dataset.all); }); save(); rebuild();
          toastUndo(hit.length+" task"+(hit.length===1?"":"s")+" — "+all.textContent.trim(), function(){
            before.forEach(function(b){ var k=b.k;
              if(S.tasks.indexOf(k)<0) S.tasks.push(k);           // "All done" never removes, but stay safe
              k.day=b.day; k.end=b.end; k.block=b.block; k.rollover=b.rollover; k.status=b.status;
              if(b.completedOn===undefined) delete k.completedOn; else k.completedOn=b.completedOn;
              if(b.carriedFrom===undefined) delete k.carriedFrom; else k.carriedFrom=b.carriedFrom;
              if(b.skippedOn===undefined) delete k.skippedOn; else k.skippedOn=b.skippedOn;
              if(b.nextAt===undefined) delete k.nextAt; else k.nextAt=b.nextAt;
              if(b.waitSince===undefined) delete k.waitSince; else k.waitSince=b.waitSince;
            });
            save(); rebuild(); render();
          });
          return; }
        if(e.target.closest("[data-rvdate],[data-rvproj]")) return;   // handled on change, not click
        var sg=e.target.closest("[data-sg-accept]");
        if(sg){ var n=0;
          sg.dataset.sgAccept.split(",").forEach(function(id){
            var k=S.tasks.find(function(x){return x.id===id;}); if(!k) return;
            rescheduleTask(k,t);
            S.focus[t]=S.focus[t]||[];
            if(!S.focus[t].some(function(f){return f.taskId===id;})) S.focus[t].push({id:uid(),taskId:id});
            n++;

          save(); rebuild(); toast(n+" moved to today and into Focus");
          return; }
        var tf=e.target.closest("[data-tmfocus]");
        if(tf){ var tmd=addDays(t,1), fa=S.focus[tmd]=S.focus[tmd]||[];
          var fi=fa.findIndex(function(f){return f.taskId===tf.dataset.tmfocus;});

          if(rh.dataset.rvh==="did"){ var hh=S.habits.find(function(x){return x.id===rh.dataset.hid;}); if(hh) setHabitLog(yH2,hh.id,hh.goal||1); save(); }
          else rvHabitSkip[rh.dataset.hid]=1;

        var wa=e.target.closest('[data-act="wait-still"],[data-act="wait-live"],[data-act="wait-letgo"]');
        if(wa){ var wrow=wa.closest("[data-id]"), wk=wrow&&S.tasks.find(function(x){return x.id===wrow.dataset.id;}); if(!wk) return;
          if(wa.dataset.act==="wait-still") stillWaiting(wk); else if(wa.dataset.act==="wait-live") wakeTask(wk); else letGoTask(wk);
          save(); rebuild(); return; }

    function rebuild(){ var m=document.querySelector(".modal"); if(!m) return;

    // remember this slot ran today, so the automatic prompt doesn't reopen on every tab focus
    function markReviewed(){ S.reviewDone=S.reviewDone||{}; S.reviewDone[t+":"+scope]=1;
      var keys=Object.keys(S.reviewDone); if(keys.length>40) keys.slice(0,keys.length-40).forEach(function(k){ delete S.reviewDone[k]; });

  /* ---------- task-time reminders (browser notifications while open) ---------- */
  var notified={};
  function checkReminders(){
    if(!S.remind || typeof Notification==="undefined" || Notification.permission!=="granted") return;
    var t=today(); var now=new Date();
    var hm=String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
    S.tasks.forEach(function(k){
      if(k.status!=="todo"||k.day!==t||!k.at||k.at!==hm) return;
      var nk=k.id+"@"+t+hm; if(notified[nk]) return; notified[nk]=1;
      try{ new Notification("Gena — "+fmtTime(k.at),{body:k.title,tag:nk}); }catch(e){}
      toast("🔔 "+k.title);
    });
  }
  setInterval(checkReminders,20000);

  /* ---------- focus timer ---------- */
  var FT={left:0,label:"",int:null,running:false};
  function ftPaint(){
    var el=document.getElementById("focus-timer");
    if(FT.left<=0){ if(el) el.remove(); return; }
    if(!el){ el=document.createElement("div"); el.className="timer"; el.id="focus-timer"; document.body.appendChild(el);
      el.onclick=function(e){ var b=e.target.closest("[data-ft]"); if(!b)return;
        if(b.dataset.ft==="pause"){ FT.running=!FT.running; ftPaint(); }
        else if(b.dataset.ft==="plus"){ FT.left+=300; ftPaint(); }
        else ftStop(); };
    }
    var m=Math.floor(FT.left/60), s=FT.left%60;
    el.innerHTML='<div><b>'+(m<10?"0":"")+m+':'+(s<10?"0":"")+s+'</b>'+(FT.label?'<div class="t-label">'+esc(FT.label)+'</div>':'')+'</div>'+
      '<button data-ft="pause">'+(FT.running?"Pause":"Resume")+'</button><button data-ft="plus">+5m</button><button data-ft="x" aria-label="Stop timer">✕</button>';
  }
  function ftStop(){ clearInterval(FT.int); FT.int=null; FT.left=0; FT.running=false; var el=document.getElementById("focus-timer"); if(el) el.remove(); }
  function ftTick(){
    if(!FT.running) return;
    FT.left--;
    if(FT.left<=0){ var lbl=FT.label; var mins=FT.mins||25; ftStop(); beep(); toast("⏱ Focus block done — stretch!");
      logFocusSession(lbl,mins);
      try{ if(typeof Notification!=="undefined"&&Notification.permission==="granted") new Notification("Gena",{body:"Focus block done"+(lbl?" — "+lbl:"")}); }catch(e){}
      return; }

  }
  // Completed focus blocks are kept so the effort shows up somewhere afterwards, not just as a beep.
  function logFocusSession(label,mins){
    S.sessions=S.sessions||[];
    S.sessions.push({id:uid(),day:today(),mins:mins||25,label:label||"",at:new Date().toTimeString().slice(0,5)});
    if(S.sessions.length>500) S.sessions=S.sessions.slice(-500);

  function sessionsOn(day){ return (S.sessions||[]).filter(function(x){return x.day===day;}); }

  function startFocusTimer(label,mins){
    FT.label=label||""; FT.mins=mins||25; FT.left=(mins||25)*60; FT.running=true;
    if(!FT.int) FT.int=setInterval(ftTick,1000);

  function beep(){ try{ var C=window.AudioContext||window.webkitAudioContext; var ctx=new C(); var o=ctx.createOscillator(), g=ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.frequency.value=880; g.gain.setValueAtTime(.001,ctx.currentTime); g.gain.exponentialRampToValueAtTime(.2,ctx.currentTime+.02); g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.9); o.start(); o.stop(ctx.currentTime+1); }catch(e){} }

  /* ---------- optional passcode lock (device-only, screen lock — not encryption) ---------- */

  function showLock(){

    box.innerHTML='<div class="lock-box"><div style="font-size:34px">🔒</div><h3 style="margin:8px 0 4px">Gena is locked</h3><p class="sub" style="margin:0 0 4px">Enter your passcode</p><input id="lock-in" type="password" inputmode="numeric" autocomplete="off" style="width:100%;text-align:center;font-size:20px;letter-spacing:.25em;padding:11px;border:1.5px solid var(--line);border-radius:12px;margin:8px 0;background:var(--sheet);color:var(--ink)"/><div id="lock-err" class="sub" style="color:var(--terra-deep);min-height:18px;margin:0"></div><button class="btn primary" id="lock-go" style="width:100%">Unlock</button></div>';
    document.body.appendChild(box);

    document.getElementById("lock-go").onclick=tryUnlock;

  }
  /* Passcode = encryption. Turning it on re-writes the store as an envelope and drops the old

          '<p class="sub" style="color:var(--warn)"><b>If you forget it, nothing can recover the data.</b> Keep a backup file (⋯ → Export) somewhere safe first.</p>'+
          (old?'<p class="sub">Your old screen-only lock will be replaced — it hid the screen but didn’t protect the data.</p>':'')+
          '<div class="row"><div class="fld"><label>Passcode (6+ characters)</label><input id="en-new" type="password" autocomplete="new-password" placeholder="Something you’ll remember"/></div>'+
          '<div class="fld"><label>Again</label><input id="en-new2" type="password" autocomplete="new-password"/></div></div>'+
          '<div class="modal-actions"><button class="btn ghost" data-x>Cancel</button><button class="btn primary" id="en-set">Encrypt &amp; set passcode</button></div>'));
    var dx0=document.querySelector(".modal [data-x]"); if(dx0) dx0.onclick=close;

      document.getElementById("en-off").onclick=function(){ confirmModal("Turn encryption off?","Your data will be stored readable again on this device and in cloud sync.","Turn off",function(){

  function icsEsc(s){ return String(s||"").replace(/\\/g,"\\\\").replace(/([,;])/g,"\\$1").replace(/\n/g,"\\n"); }
  // Build a full iCalendar. alarms=true adds VALARM reminders (used for the subscribable feed).
  function buildICS(alarms){
    var L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Gena//Gena Planner//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:Gena","X-WR-CALDESC:Gena tasks & deadlines"];
    var horizon=addDays(today(),-1); // keep it lean: only today-forward
    S.tasks.forEach(function(k){ if(!k.day || k.status==="done" || lastDay(k.day,k.end)<horizon) return;
      var timed=/^\d{2}:\d{2}$/.test(k.at||"");
      L.push("BEGIN:VEVENT","UID:task-"+k.id+"@daybook","SUMMARY:"+icsEsc(k.title));
      if(timed){ L.push("DTSTART:"+k.day.replace(/-/g,"")+"T"+k.at.replace(":","")+"00","DURATION:PT"+(k.dur||60)+"M"); }
      else { L.push("DTSTART;VALUE=DATE:"+k.day.replace(/-/g,""));
        if(k.end&&k.end>k.day) L.push("DTEND;VALUE=DATE:"+addDays(k.end,1).replace(/-/g,"")); }   // DTEND is exclusive
      if(k.notes){ var n=htmlToText(k.notes); if(n) L.push("DESCRIPTION:"+icsEsc(n)); }
      if(alarms){ L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(k.title),
        "TRIGGER"+(timed?":-PT30M":";RELATED=START:PT8H"),"END:VALARM"); } // timed: 30m before; all-day: 8am day-of
      L.push("END:VEVENT");
    });
    S.events.forEach(function(ev){ if(!ev.date || lastDay(ev.date,ev.end)<horizon) return;
      L.push("BEGIN:VEVENT","UID:ev-"+ev.id+"@daybook","DTSTART;VALUE=DATE:"+ev.date.replace(/-/g,""),"SUMMARY:"+icsEsc(ev.title));
      if(ev.end&&ev.end>ev.date) L.push("DTEND;VALUE=DATE:"+addDays(ev.end,1).replace(/-/g,""));
      if(alarms){ L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(ev.title),"TRIGGER;RELATED=START:PT8H","END:VALARM"); }
      L.push("END:VEVENT");
    });
    S.jobs.forEach(function(j){ if(!j.nextDate || j.nextDate<horizon || (j.stage==="Closed")) return;
      var sum="Follow up: "+(j.company||"job")+(j.next?" — "+j.next:"");
      L.push("BEGIN:VEVENT","UID:job-"+j.id+"@daybook","DTSTART;VALUE=DATE:"+j.nextDate.replace(/-/g,""),"SUMMARY:"+icsEsc(sum));
      if(alarms){ L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(sum),"TRIGGER;RELATED=START:PT8H","END:VALARM"); }
      L.push("END:VEVENT");
    });
    L.push("END:VCALENDAR");
    return L.join("\r\n");
  }

    '<input id="enc-in" type="password" inputmode="text" autocomplete="current-password" placeholder="Passcode" aria-label="Passcode" style="width:100%;font-family:inherit;font-size:16px;padding:10px 12px;border:1.5px solid var(--line);border-radius:11px;background:var(--sheet);color:var(--ink)"/>'+
    '<button class="btn primary" id="enc-go" style="width:100%;margin-top:10px">Unlock</button>'+
    '<div id="enc-err" class="sub" style="min-height:18px;margin:8px 0 0;justify-content:center;color:var(--warn)"></div>'+
    '<p class="sub" style="font-size:11.5px;margin:10px 0 0;justify-content:center;text-align:center">The passcode never leaves this device and cannot be recovered. If it is lost, restore a backup file instead.</p></div>';
  document.body.appendChild(box);
  var inp=document.getElementById("enc-in"), err=document.getElementById("enc-err"), busy=false;
  setTimeout(function(){ inp.focus(); },60);
  function go(){
    if(busy) return; var pass=inp.value; if(!pass) return;
    busy=true; err.style.color="var(--ink-faint)"; err.textContent="Unlocking…";
    var salt=C.unb64(env.salt), it=env.it||150000;
    C.derive(pass,salt,it).then(function(key){ return C.decrypt(key,env).then(function(plain){
      window.__genaPlain=plain; window.__genaEnc={key:key,salt:salt,it:it};
      box.remove(); GENA_MAIN(); }); })
    .catch(function(){ busy=false; err.style.color="var(--warn)"; err.textContent="Wrong passcode"; inp.value=""; inp.focus(); });
  }
  document.getElementById("enc-go").onclick=go;
  inp.addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); go(); } });
})();
</script>
