  * { box-sizing: border-box; }
  html,body { margin:0; }
  body {
    background: var(--paper); color: var(--ink); font-family: var(--font);
    -webkit-font-smoothing: antialiased; font-size: 15px; line-height: 1.5;
  }
  /* skin scenery — a fixed illustration layer behind all content */
  :root{ --r-card:16px; --r-ctl:10px; --dur:.18s; --ease:cubic-bezier(.2,.7,.2,1); }
  body[data-scene="off"]::before{ display:none; }
  body::before{
    content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background-image:var(--scene,none); background-repeat:no-repeat;
    background-position:center bottom; background-size:cover;
  }
  button { font-family: inherit; }
  ::selection { background: var(--terra-bg); }

  .wrap { max-width: none; margin: 0; padding: 0 22px 120px; }

  /* navigation sidebar — full-height edge panel (content shifts over / expands when hidden) */
  .layout{ display:block; }
  :root{ --sbw:240px; --rbw:300px; }   /* panel widths — dragged, per device (see panelWidths) */
  #sidebar{ position:fixed; left:0; top:0; bottom:0; width:var(--sbw); z-index:45; background:var(--sheet); border-right:1.5px solid var(--line); padding:14px 12px 20px; overflow:auto; display:flex; flex-direction:column; gap:14px; transition:transform .2s ease; }
  body.sb-closed #sidebar{ transform:translateX(-102%); }
  .sb-brand{ display:flex; align-items:center; gap:8px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; font-size:12px; color:var(--ink); padding:4px 6px 0; }
  .sb-brand .sb-act{ margin-left:auto; background:none; border:none; color:var(--ink-faint); cursor:pointer; font-size:11.5px; font-weight:700; font-family:inherit; }
  .sb-brand .sb-act:hover{ color:var(--terra-deep); }
  #rightbar{ position:fixed; right:0; top:0; bottom:0; width:var(--rbw); z-index:45; background:var(--sheet); border-left:1.5px solid var(--line); padding:14px 12px 20px; overflow:auto; display:flex; flex-direction:column; gap:14px; transition:transform .2s ease; }
  body.rb-closed #rightbar{ transform:translateX(102%); }
  .rb-brand{ display:flex; align-items:center; gap:8px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; font-size:12px; color:var(--ink); padding:4px 6px 0; }
  .rb-brand .sb-act{ margin-left:auto; background:none; border:none; color:var(--ink-faint); cursor:pointer; font-size:11.5px; font-weight:700; font-family:inherit; }
  .rb-brand .sb-act:hover{ color:var(--terra-deep); }
  #rb-scrim{ display:none; }
  @media (min-width:1001px){
    .appbar, .wrap{ margin-left:var(--sbw); margin-right:0; transition:margin .2s ease; }
    body.sb-closed .appbar, body.sb-closed .wrap{ margin-left:0; }
    body:not(.rb-closed) .appbar, body:not(.rb-closed) .wrap{ margin-right:var(--rbw); }
    /* the grab strip on a panel's inner edge; the centre reflows live while you drag */
    .pane-grip{ position:absolute; top:0; bottom:0; width:10px; cursor:col-resize; z-index:2; touch-action:none; }
    #sidebar .pane-grip{ right:0; } #rightbar .pane-grip{ left:0; }
    #sidebar .pane-grip::after{ right:0; } #rightbar .pane-grip::after{ left:0; }
    .pane-grip::after{ content:""; position:absolute; top:0; bottom:0; width:3px; background:transparent; transition:background .15s; }
    .pane-grip:hover::after, body.pane-resizing .pane-grip::after{ background:var(--terra); }
    body.pane-resizing, body.pane-resizing *{ cursor:col-resize !important; user-select:none; }
    body.pane-resizing .appbar, body.pane-resizing .wrap, body.pane-resizing #sidebar, body.pane-resizing #rightbar{ transition:none; }
  }
  @media (max-width:1000px){
    #rightbar{ transform:translateX(102%); border-radius:18px 0 0 18px; box-shadow:0 0 60px rgba(0,0,0,.35); z-index:56; }
    body.rb-open #rightbar{ transform:translateX(0); }
    body.rb-open #rb-scrim{ display:block; position:fixed; inset:0; z-index:55; background:rgba(20,18,24,.4); }
  }
  .sb-card{ background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:10px; }
  .sb-h{ font-size:12px; letter-spacing:0; text-transform:none; color:var(--ink-soft); font-weight:700; margin:2px 6px 8px; display:flex; align-items:center; }
  .sb-h .sb-act{ margin-left:auto; background:none; border:none; color:var(--terra-deep); cursor:pointer; font-size:11.5px; font-weight:700; padding:0 2px; font-family:inherit; }
  .sb-row{ display:flex; align-items:center; gap:8px; width:100%; text-align:left; background:none; border:none; font-family:inherit; font-size:13.5px; color:var(--ink); padding:7px 8px; border-radius:9px; cursor:pointer; }
  .sb-row:hover{ background:var(--line-soft); }
  .sb-row[aria-pressed="true"], .sb-row.on{ background:var(--terra-bg); color:var(--terra-deep); font-weight:700; }
  .sb-row .pdot{ width:10px; height:10px; border-radius:50%; flex:none; }
  .sb-row .sb-name{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sb-row .cnt{ margin-left:auto; font-size:11px; color:var(--ink-faint); flex:none; }
  .sb-star{ background:none; border:none; cursor:pointer; color:var(--ink-faint); font-size:13px; padding:0 2px; flex:none; }
  .sb-star.on{ color:var(--warn); }
  .sb-mini{ font-size:11px; color:var(--ink-faint); padding:4px 8px 2px; line-height:1.45; }
  #sb-scrim{ display:none; }
  @media (max-width:1000px){
    #sidebar{ transform:translateX(-102%); border-radius:0 18px 18px 0; box-shadow:0 0 60px rgba(0,0,0,.35); z-index:56; width:266px; }
    body.sb-open #sidebar{ transform:translateX(0); }
    body.sb-open #sb-scrim{ display:block; position:fixed; inset:0; z-index:55; background:rgba(20,18,24,.4); }
  }

  /* global header strip — name, date, clock on every tab */
  .global-head{ display:flex; align-items:baseline; justify-content:flex-end; gap:10px; flex-wrap:wrap; padding:8px 6px 0; }
  .global-head::before{ display:none !important; content:none; }
  .gh-name{ font-size:12.5px; font-weight:600; color:var(--ink-faint); }
  .gh-date{ font-size:13.5px; font-weight:700; color:var(--ink-soft); }

  /* per-section progress (health bars) */
  .fold-prog{ display:inline-flex; align-items:center; gap:6px; flex:none; }
  .fp-track{ width:64px; height:7px; border-radius:999px; background:var(--line-soft); overflow:hidden; }
  .fp-fill{ display:block; height:100%; border-radius:999px; background:var(--good); transition:width .3s ease; }
  .fp-n{ font-size:10.5px; color:var(--ink-faint); font-weight:700; font-variant-numeric:tabular-nums; }

  /* top bar */
  .appbar {
    position: sticky; top: 0; z-index: 30; background: var(--slate);
    border-radius: 0 0 18px 18px; box-shadow: 0 4px 20px -8px var(--shadow);
  }
  .appbar-inner { max-width:none; margin:0; padding: 12px 18px 12px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  @media (min-width:1001px){ .appbar-inner{ flex-wrap:nowrap; } .appbar .nav{ flex:none; } .sync-chip{ flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; } .appbar .brand{ flex:none; } }
  #theme-btn{ display:none; }   /* light / dark lives in ⋯ (and ◐ there) — one icon fewer in the bar */
  .brand { color: var(--slate-ink); font-weight: 800; letter-spacing:.12em; text-transform:uppercase; font-size:15px; white-space:nowrap; display:flex; align-items:center; gap:8px; }
  .brand-mark { flex:none; width:19px; height:19px; color: var(--terra); }
  .appbar .spacer { flex:1; }
  .navhist{ display:inline-flex; gap:2px; }
  .navhist .icon-btn{ width:30px; height:30px; font-size:19px; line-height:1; }
  .navhist .icon-btn[disabled]{ opacity:.3; cursor:default; }
  .icon-btn {
    background: rgba(255,255,255,.1); color: var(--slate-ink); border: none;
    width: 34px; height: 34px; border-radius: 10px; cursor: pointer; font-size: 15px;
    display: inline-flex; align-items:center; justify-content:center; transition: background .15s;
  }
  .icon-btn:hover { background: rgba(255,255,255,.22); }
  .icon-btn:focus-visible { outline: 2px solid var(--terra); outline-offset:2px; }

  .nav { display:flex; gap:4px; background: rgba(0,0,0,.14); padding:4px; border-radius: 12px; overflow-x:auto;
    scrollbar-width:none; }             /* it still scrolls on narrow screens — without the grey strip */
  .nav::-webkit-scrollbar{ display:none; }
  .nav button {
    border:none; background:transparent; color: rgba(255,255,255,.7); cursor:pointer;
    padding: 7px 15px; border-radius: 9px; font-size: 13.5px; font-weight:600; white-space:nowrap; transition: all .15s;
  }
  .nav button:hover { color:#fff; }
  .nav button[aria-current="true"] { background: var(--sheet); color: var(--slate); }

  /* quick capture */
  .capture { display:flex; gap:8px; align-items:center; margin: 18px 0 10px; flex-wrap:wrap; }
  .capture input.q {
    flex: 1 1 260px; min-width: 0; font-family:inherit; font-size:15px; color:var(--ink);
    background: var(--card); border:1.5px solid var(--line); border-radius: 12px; padding: 12px 15px;
    transition: border-color .15s;
  }
  .capture input.q:focus { outline:none; border-color: var(--terra); }
  .capture select, .capture .add {
    font-family:inherit; font-size:14px; border-radius:12px; padding:11px 13px; cursor:pointer;
    background: var(--card); color: var(--ink); border:1.5px solid var(--line);
  }
  .capture .add { background: var(--good); color:#fff; border-color: var(--good); font-weight:700; padding:11px 18px; }
  .capture .add:hover { background: var(--good-deep); }

  h2.view-h { font-size: 22px; font-weight:700; margin: 4px 0 2px; letter-spacing:-.02em; }
  .grouped > h2.view-h:first-child{ display:none; }
  .grouped > h2.view-h:first-child + p.sub{ display:none; }
  /* segmented control — the Plan / Lists sub-views */
  .seg{ display:inline-flex; gap:2px; padding:3px; background:var(--line-soft); border-radius:12px; margin:2px 0 14px; }
  .seg button{ font-family:inherit; font-size:13px; font-weight:600; padding:6px 14px; border:none; border-radius:9px; background:transparent; color:var(--ink-soft); cursor:pointer; transition:background var(--dur) var(--ease), color var(--dur) var(--ease); }
  .seg button:hover{ color:var(--ink); }
  .seg button[aria-selected="true"]{ background:var(--card); color:var(--ink); box-shadow:0 1px 2px var(--shadow); }
  @media (max-width:480px){ .seg{ display:flex; } .seg button{ flex:1; padding:7px 4px; } }
  .sub { color: var(--ink-soft); font-size: 13.5px; margin:0 0 16px; }

  .card { background: var(--card); border:1.5px solid var(--line); border-radius: 16px; padding: 16px 18px; }
  .grid2 { display:grid; grid-template-columns: 1.3fr 1fr; gap: 18px; }
  @media (max-width: 820px){ .grid2 { grid-template-columns: 1fr; } }
  .stack { display:flex; flex-direction:column; gap:16px; }

  .label { font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft); font-weight:700; margin:0 0 10px; }

  /* task list */
  .tasks { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; }
  .task { display:flex; align-items:flex-start; gap:11px; padding:10px 4px; border-bottom:1px solid var(--line-soft); }
  .task:last-child{ border-bottom:none; }
  .chk { flex:none; width:20px; height:20px; margin-top:1px; border-radius:50%; border:1.7px solid var(--line); background:transparent; cursor:pointer; position:relative; transition: all .14s; }
  .chk:hover{ border-color: var(--terra); }
  .chk.done{ background: var(--good); border-color: var(--good); }
  .chk.done::after{ content:""; position:absolute; left:6px; top:3px; width:5px; height:9px; border:solid #fff; border-width:0 2px 2px 0; transform:rotate(42deg); }
  .task-main{ flex:1; min-width:0; }
  .task-title{ font-size:15px; word-wrap:break-word; }
  .task.done .task-title{ text-decoration:line-through; color:var(--ink-faint); }
  /* skipped: resolved, but not an achievement — muted and struck, without the done tick's colour */
  .task.skipped{ opacity:.62; }
  .task.skipped .task-title{ text-decoration:line-through; text-decoration-style:dotted; color:var(--ink-faint); }
  .pill.skip{ background:var(--line); color:var(--ink-faint); }
  .habit-row .chk{ border-radius:50%; }
  .habit-row .chk.done{ background:var(--good); border-color:var(--good); }
  .check-row{ display:flex; gap:8px; align-items:flex-start; cursor:pointer; text-transform:none; letter-spacing:0; font-weight:600; }
  .check-row input{ margin-top:3px; }
  .task.waiting{ opacity:.9; }
  .task.waiting .wait-ico{ width:22px; height:22px; display:inline-flex; align-items:center; justify-content:center; color:var(--ink-faint); flex:0 0 22px; font-size:13px; }
  .task.waiting.landed{ background:var(--warn-bg); border-radius:10px; }
  .wait-acts{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .wait-q{ font-size:12px; margin-top:4px; color:var(--warn); }
  .cnt-hot{ color:var(--warn); font-weight:800; }
  .waitbox{ margin:4px 0 6px; padding:8px 10px; border:1px dashed var(--line); border-radius:10px; }
  .waitbox input,.waitbox select{ width:100%; margin-bottom:4px; }
  .cyc-row{ display:flex; gap:6px; } .cyc-row input{ width:64px; flex:0 0 64px; }
  .imp-item.shipped{ opacity:.6; }
  .imp-item.shipped>div>div:first-child{ text-decoration:line-through; }
  .imp-n{ display:inline-block; min-width:18px; margin-right:6px; padding:0 4px; border-radius:6px;
    background:var(--line); color:var(--ink-faint); font-size:11px; font-weight:700; text-align:center; }
  .task-meta{ display:block; margin-top:3px; font-size:11.5px; line-height:1.7; color:var(--ink-soft); }
  .task-meta .pill{ background:transparent !important; color:var(--ink-soft) !important; padding:0; font-weight:600; font-size:11.5px; border-radius:0; display:inline; white-space:nowrap; }
  .task-meta .pill.proj .pdot{ display:inline-block; vertical-align:middle; margin-right:3px; }
  .task-meta .pill+.pill::before{ content:"\200B"; white-space:normal; }
  .task-meta .pill:not(:last-child)::after{ content:" ·"; margin:0 5px 0 4px; color:var(--ink-faint); font-weight:700; }
  .task-meta .pill.proj{ --pc:var(--p0); }
  .task-meta .pill.proj .pdot{ width:7px; height:7px; border-radius:50%; background:var(--pc); flex:none; margin-right:1px; }
  .task-meta .pill.imp{ color:var(--terra-deep) !important; font-weight:800; }
  .task-meta .pill.aged.hot, .task-meta .pill.due.hot{ color:var(--warn) !important; font-weight:800; }
  .task-meta .pill.more{ color:var(--ink-faint) !important; }
  .pill{ font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; display:inline-flex; align-items:center; gap:4px; }
  .pill.proj{ color:#fff; }
  /* Only the project pill keeps a solid fill — everything else is quiet text, so titles win.
     "carried" earns red at a week; before that it's information, not an alarm. */
  .pill.aged{ background:transparent; color:var(--ink-faint); padding-left:0; padding-right:6px; }
  .pill.aged.hot{ background: var(--warn-bg); color: var(--warn); padding:2px 8px; }
  .pill.rec{ background:transparent; color:var(--terra-deep); padding-left:0; padding-right:6px; }
  .pill.block{ background:transparent; color:var(--ink-faint); padding-left:0; padding-right:6px; }
  .pill.due{ background:transparent; color:var(--slate-2,var(--ink-soft)); font-weight:800; padding-left:0; padding-right:6px; }
  .pill.due.hot{ background:var(--warn-bg); color:var(--warn); padding:2px 8px; }
  .pill.more{ background:var(--line-soft); color:var(--ink-soft); cursor:default; }
  /* carried card: one primary action, the rest behind a native fold — 33 items × 6 buttons was a wall */
  .pm-fold{ display:inline-block; }
  .pm-fold summary{ list-style:none; cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:800; color:var(--ink-faint); border:1px solid var(--line); border-radius:999px;
    padding:2px 9px; background:var(--card); }
  .pm-fold summary::-webkit-details-marker{ display:none; }
  .pm-fold summary:hover{ color:var(--ink); border-color:var(--ink-faint); }
  .pm-fold[open] summary{ background:var(--line-soft); }
  .pm-fold>.panel-move{ margin-top:5px; }
  .task-x{ flex:none; background:transparent; border:none; color:var(--ink-faint); cursor:pointer; font-size:16px; padding:2px 4px; border-radius:6px; opacity:0; transition:opacity .15s; }
  .task:hover .task-x{ opacity:1; }
  .task-x:hover{ color: var(--terra-deep); background: var(--terra-bg); }
  .empty{ color:var(--ink-faint); font-size:13.5px; padding:14px 4px; text-align:center; }

  .block-head{ display:flex; align-items:center; gap:8px; margin:18px 0 6px; }
  .block-head .label{ margin:0; text-transform:none; letter-spacing:0; font-size:13.5px; font-weight:700; color:var(--ink); }
  .panel-task:hover .task-focus, .panel-task:hover .task-star, .panel-task:hover .task-x, .panel-task .task-star.on, .panel-task .task-focus.on{ opacity:1; }
  .panel-task .task-focus, .panel-task .task-star, .panel-task .task-x{ opacity:0; transition:opacity var(--dur) var(--ease); }
  @media (hover:none){ .panel-task .task-focus, .panel-task .task-star, .panel-task .task-x{ opacity:1; } }
  .block-head .cnt{ font-size:11px; color:var(--ink-faint); }

  /* habits */
  .habit{ display:flex; align-items:center; gap:12px; padding:9px 0; border-bottom:1px solid var(--line-soft); }
  .habit:last-child{ border-bottom:none; }
  .habit .hname{ flex:1; font-size:14px; }
  .habit .streak{ font-size:11.5px; color:var(--terra-deep); font-weight:700; }
  .dots{ display:flex; gap:6px; }
  .dot{ width:16px; height:16px; border-radius:50%; border:1.6px solid var(--line); background:transparent; cursor:pointer; transition: all .12s; }
  .dot:hover{ border-color:var(--terra-deep); }
  .dot.on{ background: var(--terra); border-color: var(--terra-deep); }

  textarea.notes{ width:100%; min-height:120px; font-family:inherit; font-size:14.5px; line-height:1.6; color:var(--ink); background:transparent; border:none; resize:vertical; }
  textarea.notes:focus{ outline:none; }
  textarea.notes::placeholder{ color:var(--ink-faint); }

  /* suggestions */
  .sugg{ background: var(--terra-bg); border:1.5px solid transparent; border-radius:14px; padding:12px 14px; display:flex; gap:10px; align-items:flex-start; }
  .sugg .stxt{ flex:1; font-size:13.5px; color: var(--terra-deep); line-height:1.45; }
  .sugg .stxt b{ font-weight:800; }
  .sugg-act{ background: var(--terra); color:#fff; border:none; border-radius:9px; padding:6px 11px; font-size:12.5px; font-weight:700; cursor:pointer; white-space:nowrap; }
  .sugg-act:hover{ background: var(--terra-deep); }
  .sugg-dismiss{ background:transparent; border:none; color:var(--terra-deep); cursor:pointer; font-size:15px; opacity:.6; padding:0 2px; }
  .sugg-dismiss:hover{ opacity:1; }
  .sugg-note{ font-size:11px; color:var(--ink-faint); margin:2px 0 10px; display:flex; align-items:center; gap:5px; }
  .pane-sugg{ flex-wrap:wrap; font-size:12.5px; padding:8px 10px; margin-bottom:6px; }
  .pane-sugg .stxt{ flex:1 1 100%; }

  /* projects board */
  .board{ display:grid; grid-template-columns: repeat(auto-fill, minmax(270px,1fr)); gap:16px; }
  .proj-card{ background:var(--card); border:1.5px solid var(--line); border-radius:16px; overflow:hidden; }
  details.proj-card>summary{ list-style:none; cursor:pointer; display:flex; align-items:center; gap:10px; }
  details.proj-card>summary::-webkit-details-marker{ display:none; }
  details.proj-card>summary .ptop-main{ flex:1 1 auto; min-width:0; }
  details.proj-card>summary .fold-chev{ flex:0 0 auto; opacity:.55;
    transition:transform var(--dur) var(--ease); }
  details.proj-card[open]>summary .fold-chev{ transform:rotate(90deg); }
  .proj-top{ padding:14px 16px; color:#fff; }
  .proj-top h3{ margin:0; font-size:16px; font-weight:800; }
  .proj-top .pmeta{ font-size:12px; opacity:.9; margin-top:3px; }
  .proj-body{ padding:12px 16px 16px; }
  .person-card{ box-shadow:inset 4px 0 0 var(--pc); }
  .person-top{ background:var(--card); color:var(--ink); border-bottom:1px solid var(--line-soft); }
  .person-top h3{ display:flex; align-items:center; gap:10px; }
  .person-top .pmeta{ color:var(--ink-soft); }
  .person-emoji{ width:34px; height:34px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:19px; background:color-mix(in srgb, var(--pc) 18%, var(--card)); }
  .person-emoji.pdot-big{ background:var(--pc); }
  .mini-cols{ display:flex; flex-direction:column; gap:4px; }
  .prog{ height:7px; border-radius:999px; background:var(--line-soft); overflow:hidden; margin:8px 0 12px; }
  .prog span{ display:block; height:100%; border-radius:999px; }
  .proj-notes{ width:100%; min-height:54px; margin-top:8px; font-family:inherit; font-size:13px; color:var(--ink); background:var(--sheet); border:1px solid var(--line-soft); border-radius:10px; padding:8px 10px; resize:vertical; }
  .proj-notes:focus{ outline:none; border-color:var(--terra); }

  /* calendar */
  .cal-head{ display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .cal-head h3{ margin:0; font-size:18px; font-weight:800; min-width:180px; }
  .cal-grid{ display:grid; grid-template-columns: repeat(7,1fr); gap:6px; }
  .cal-dow{ font-size:11px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.08em; text-align:center; padding:4px 0; }
  .cal-cell{ background:var(--card); border:1.5px solid var(--line); border-radius:11px; min-height:88px; padding:6px 7px; cursor:pointer; transition:border-color .12s; overflow:hidden; }
  .cal-cell:hover{ border-color: var(--terra); }
  .cal-cell.drag-over, .wk-col.drag-over{ outline:2px dashed var(--terra); outline-offset:-2px; background:var(--terra-bg); }
  .cal-ev[data-tid]{ cursor:grab; }
  .cal-cell.dim{ opacity:.4; }
  .cal-cell.today{ border-color: var(--terra); background: var(--terra-bg); }
  .cal-daynum{ font-size:12.5px; font-weight:700; color:var(--ink-soft); }
  .cal-cell.today .cal-daynum{ color: var(--terra-deep); }
  .cal-ev{ font-size:10.5px; margin-top:3px; padding:2px 5px; border-radius:5px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cal-ev.evt{ background: var(--slate); }
  /* multi-day runs: bleed to the cell edge and square the side the run continues on, so the eye reads
     one strip across the row; only the first day carries the title */
  .cal-ev.sp-start{ border-top-right-radius:0; border-bottom-right-radius:0; margin-right:-8px; }
  .cal-ev.sp-end{ border-top-left-radius:0; border-bottom-left-radius:0; margin-left:-8px; }
  .cal-ev.sp-mid{ border-radius:0; margin-left:-8px; margin-right:-8px; min-height:15px; }
  .cal-more{ font-size:10px; color:var(--ink-faint); margin-top:2px; }

  /* timeline */
  .tl-scroll{ overflow-x:auto; padding-bottom:8px; }
  .tl{ min-width:640px; }
  .tl-months{ display:flex; border-bottom:1.5px solid var(--line); margin-bottom:6px; position:sticky; top:62px; background:var(--paper); z-index:4; }
  .tl-month{ font-size:11.5px; font-weight:700; color:var(--ink-soft); padding:4px 8px; border-left:1px solid var(--line-soft); }
  .tl-row{ display:flex; align-items:center; gap:10px; padding:6px 0; border-bottom:1px solid var(--line-soft); }
  .tl-name{ width:120px; flex:none; font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; position:sticky; left:0; background:var(--paper); z-index:3; padding-right:6px; display:flex; align-items:center; gap:7px; }
  .tl-name .pdot{ width:8px; height:8px; border-radius:50%; flex:none; }
  .tl-track{ position:relative; flex:1; height:30px; background:var(--sheet); border:1px solid var(--line-soft); border-radius:8px; }
  .tl-today::after{ content:"today"; position:absolute; top:-15px; left:-16px; font-size:9px; font-weight:800; color:var(--terra-deep); letter-spacing:.06em; }
  /* the eight-week strip in a project card: phases as bars, tasks as ticks, today as a line */
  .mini-tl{ position:relative; height:22px; margin:10px 0 4px; background:var(--sheet); border:1px solid var(--line-soft); border-radius:6px; overflow:hidden; cursor:pointer; }
  .mini-tl .mt-bar{ position:absolute; top:4px; height:14px; border-radius:4px; opacity:.5; }
  .mini-tl .mt-tick{ position:absolute; top:6px; width:3px; height:10px; border-radius:2px; opacity:.85; }
  .mini-tl .mt-tick.done{ opacity:.3; }
  .mini-tl .mt-today{ position:absolute; top:0; bottom:0; width:2px; background:var(--terra); }
  .mini-tl .mt-lbl{ position:absolute; right:6px; top:4px; font-size:9.5px; color:var(--ink-faint); font-weight:700; }
  .tl-bar{ position:absolute; top:3px; height:20px; border-radius:7px; color:#fff; font-size:11px; font-weight:700; padding:2px 8px; overflow:hidden; white-space:nowrap; display:flex; align-items:center; }
  .tl-today{ position:absolute; top:-4px; bottom:-4px; width:2px; background:var(--terra); }
  .tl-dot{ position:absolute; top:4px; width:15px; height:15px; border-radius:50%; transform:translateX(-7px); cursor:pointer; color:#fff; font-size:9px; font-weight:800; display:flex; align-items:center; justify-content:center; box-shadow:0 1px 3px rgba(0,0,0,.35); border:1.5px solid var(--card); z-index:2; }
  .tl-dot:hover{ transform:translateX(-7px) scale(1.25); }
  .tl-ev{ position:absolute; top:6px; width:11px; height:11px; background:var(--slate); transform:translateX(-6px) rotate(45deg); z-index:2; }
  .tl-legend{ display:flex; gap:16px; flex-wrap:wrap; font-size:11.5px; color:var(--ink-soft); margin:2px 0 10px; }
  .tl-legend span{ display:inline-flex; align-items:center; gap:5px; }

  /* modal */
  .scrim{ position:fixed; inset:0; background:rgba(20,18,24,.5); z-index:64; display:flex; align-items:center; justify-content:center; padding:16px; padding-bottom:calc(16px + env(safe-area-inset-bottom)); }
  /* A fixed scrim IS the visible viewport; 90vh is not — on iOS vh means the large viewport (URL bar
     hidden), so a tall modal ran past the bottom of the screen and its sticky footer ("Start the day")
     could not be scrolled to. max-height:100% resolves against the scrim's content box instead, which
     is always exactly what you can see. overscroll-behavior stops the rubber-band bounce escaping. */
  .modal{ background:var(--sheet); border-radius:var(--r-card); width:min(460px,100%); max-height:100%; overflow:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; padding:22px; box-shadow:0 30px 60px -20px rgba(0,0,0,.5); }
  .modal h3{ margin:0 0 4px; font-size:18px; font-weight:800; }
  .modal .fld{ margin:14px 0; }
  .modal label{ display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); text-transform:none; letter-spacing:0; margin-bottom:6px; }
  .modal input, .modal select, .modal textarea{ width:100%; font-family:inherit; font-size:15px; color:var(--ink); background:var(--card); border:1.5px solid var(--line); border-radius:11px; padding:10px 12px; }
  .modal input:focus,.modal select:focus,.modal textarea:focus{ outline:none; border-color:var(--terra); }
  .row{ display:flex; gap:10px; }
  .row>*{ flex:1; }
  .modal-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top:20px; flex-wrap:wrap; }
  /* wide two-column modal: writing on the left, scheduling on the right, actions pinned so Save /
     Delete / focus are always reachable without scrolling to the bottom of a long form */
  .modal.wide{ width:min(880px,100%); padding-bottom:0; }
  .modal.wide .m-cols{ display:flex; gap:24px; align-items:flex-start; }
  .modal.wide .m-col-main{ flex:1 1 56%; min-width:0; }
  .modal.wide .m-col-side{ flex:1 1 44%; min-width:0; border-left:1px solid var(--line-soft); padding-left:22px; }
  .modal.wide .m-col-main .fld:first-child, .modal.wide .m-col-side .fld:first-child{ margin-top:0; }
  .modal.wide .modal-actions{ position:sticky; bottom:0; background:var(--sheet); border-top:1px solid var(--line-soft); padding:13px 0 calc(13px + env(safe-area-inset-bottom)); margin-top:18px; z-index:3; }
  @media (max-width:760px){
    .modal.wide .m-cols{ flex-direction:column; gap:0; }
    .modal.wide .m-col-side{ border-left:none; padding-left:0; border-top:1px solid var(--line-soft); padding-top:6px; margin-top:14px; }
  }
  .btn{ font-family:inherit; font-size:14px; font-weight:600; border-radius:var(--r-ctl); transition:background var(--dur) var(--ease), border-color var(--dur) var(--ease), transform var(--dur) var(--ease); padding:10px 18px; cursor:pointer; border:1.5px solid var(--line); background:var(--card); color:var(--ink); }
  /* Affirmative actions (Save / Add / Apply) read green; destructive ones red. Both use the existing
     --good / --warn tokens, so they follow every skin and both themes. */
  .btn.primary{ background:var(--good); border-color:var(--good); color:#fff; }
  .btn.primary:hover{ background:var(--good-deep); border-color:var(--good-deep); }
  .btn.danger{ color:var(--warn); border-color:var(--warn-bg); }
  .btn.danger:hover{ background:var(--warn-bg); border-color:var(--warn); color:var(--warn); }
  .btn.primary.danger{ background:var(--warn); border-color:var(--warn); color:#fff; }
  .btn.primary.danger:hover{ background:var(--warn-deep); border-color:var(--warn-deep); color:#fff; }
  .btn.ghost{ background:transparent; }
  .swatches{ display:flex; gap:8px; flex-wrap:wrap; }
  .sw{ width:30px; height:30px; border-radius:50%; cursor:pointer; border:3px solid transparent; }
  /* built-in emoji shortcut grid — the text input beside it still takes anything you type or paste */
  .emoji-pick{ display:grid; grid-template-columns:repeat(auto-fill,minmax(34px,1fr)); gap:4px; margin-top:8px;
    max-height:132px; overflow-y:auto; padding:6px; border:1px solid var(--line); border-radius:11px; background:var(--card); }
  .emoji-b{ font-size:18px; line-height:1; padding:5px 0; border:none; background:transparent; border-radius:8px; cursor:pointer; }
  .emoji-b:hover{ background:var(--terra-bg); }
  .emoji-b.on{ background:var(--terra); }
  .sw-custom{ width:30px; height:30px; padding:0; border:2px dashed var(--line-strong,var(--ink-faint)); border-radius:50%; cursor:pointer; background:var(--card); }

  /* density & font (Phase 9b) — scale the two things that actually drive comfort: row padding and text */
  :root[data-density="compact"]{ --row-pad:7px; --card-pad:13px; --gap:10px; }
  :root[data-density="cozy"]{ --row-pad:11px; --card-pad:18px; --gap:14px; }
  :root[data-density="roomy"]{ --row-pad:16px; --card-pad:24px; --gap:19px; }
  :root[data-density="compact"] .task{ padding-top:var(--row-pad); padding-bottom:var(--row-pad); }
  :root[data-density="roomy"] .task{ padding-top:var(--row-pad); padding-bottom:var(--row-pad); }
  :root[data-density="compact"] .card{ padding:var(--card-pad); }
  :root[data-density="roomy"] .card{ padding:var(--card-pad); }
  :root[data-density="compact"] body{ font-size:14px; }
  :root[data-density="roomy"] body{ font-size:16px; }
  :root[data-font="serif"]{ --font: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
  :root[data-font="system"]{ --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable", "Segoe UI", Roboto, Inter, system-ui, sans-serif; }
  :root[data-font="mono"]{ --font: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  /* keyboard users get a visible ring everywhere; mouse users don't (Phase 9b a11y pass) */

  .task-more{ display:none; flex:none; width:32px; height:32px; align-items:center; justify-content:center; border:none; background:transparent; color:var(--ink-faint); font-size:18px; font-weight:800; border-radius:8px; cursor:pointer; align-self:flex-start; }
  .task-more:active{ background:var(--line-soft); }
  /* the action sheet — a modal that rises from the bottom edge on a phone */
  .scrim.sheet-scrim{ align-items:flex-end; padding:0; }
  .modal.sheet{ width:100%; max-width:560px; border-radius:var(--r-card) var(--r-card) 0 0; padding:10px 14px calc(14px + env(safe-area-inset-bottom)); animation:sheetUp .22s var(--ease); }
  @keyframes sheetUp{ from{ transform:translateY(24px); opacity:0; } }
  .sheet-grip{ width:36px; height:4px; border-radius:2px; background:var(--line); margin:0 auto 10px; }
  .sheet-title{ font-size:14px; font-weight:700; color:var(--ink); margin:0 4px 8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sheet-row{ display:flex; align-items:center; gap:12px; width:100%; text-align:left; font-family:inherit; font-size:15px; color:var(--ink); background:transparent; border:none; padding:12px 8px; border-radius:10px; cursor:pointer; }
  .sheet-row:active{ background:var(--line-soft); }
  .sheet-row .si{ width:26px; text-align:center; font-size:17px; }
  .sheet-row.danger{ color:var(--warn); }
  @media (min-width:761px){ .modal.sheet{ border-radius:var(--r-card); } .scrim.sheet-scrim{ align-items:center; padding:16px; } }
  .at-btn.q-at{ width:34px; height:34px; opacity:.8; align-self:center; }
  .inline-add{ flex:1; min-width:0; border:none; background:transparent; font-family:inherit; font-size:15px; color:var(--ink); padding:4px 0; }
  .inline-add:focus{ outline:none; }
  .inline-add::placeholder{ color:var(--ink-faint); }
  .today-head{ display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  .clock{ font-size:12.5px; color:var(--ink-faint); font-weight:600; font-variant-numeric:tabular-nums; }
  .clock b{ color:var(--ink); font-weight:800; } .clock .sea{ color:var(--terra-deep); }
  details.fold{ padding:0; }
  details.fold>summary{ list-style:none; cursor:pointer; display:flex; align-items:center; gap:10px; padding:15px 18px; }
  details.fold>summary::-webkit-details-marker{ display:none; }
  details.fold[open]>summary{ padding-bottom:6px; }
  details.fold>summary .fold-label{ flex:1; font-size:14px; letter-spacing:-.01em; text-transform:none; color:var(--ink); font-weight:700; }
  details.fold>summary .fold-chev{ color:var(--ink-faint); font-size:12px; transition:transform .15s; }
  details.fold[open]>summary .fold-chev{ transform:rotate(90deg); }
  .fold-body{ padding:0 18px 16px; }
  .blocks-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; margin-top:16px; }
  details.hub-cap summary{ cursor:pointer; }
  details.hub-cap summary.label{ margin:0; }
  details.hub-cap[open] summary.label{ margin-bottom:10px; }

  .wk-cols{ display:grid; gap:8px; }
  .wk-tg-wrap{ overflow-x:auto; padding-bottom:6px; }
  .wk-tg{ display:grid; gap:0 6px; align-items:stretch; }
  .wk-tg-head{ font-size:12px; font-weight:700; color:var(--ink-soft); text-align:center; padding:4px 0 6px; cursor:pointer; border-radius:8px; }
  .wk-tg-head:hover{ background:var(--line-soft); }
  .wk-tg-head.today{ color:var(--terra-deep); }
  .wk-tg-head.today b{ background:var(--terra); color:#fff; border-radius:50%; padding:2px 6px; }
  .wk-allday{ min-height:26px; max-height:128px; overflow-y:auto; margin:0 0 6px; padding:4px; background:var(--sheet); border:1px dashed var(--line-soft); border-radius:8px; list-style:none; display:flex; flex-direction:column; gap:3px; }
  .wk-allday.drag-over{ background:var(--terra-bg); border-color:var(--terra); }
  .wk-allday .cal-ev{ margin:0; cursor:pointer; }
  .wk-allday .cal-ev.plain{ background:var(--card); color:var(--ink); border:1px solid var(--line); }
  .wk-tg-labels .hour-label{ height:48px; border-right:none; padding-top:2px; font-size:10.5px; }
  .wk-tg-labels .hour-label:first-child{ height:48px; }
  .wk-tg-col{ border-radius:10px; }
  .wk-tg-col.today{ background:var(--terra-bg); }
  .wk-tg-col .tb-layer{ left:2px; right:2px; }
  .wk-tg-col .tblock{ font-size:11px; padding:2px 6px; }
  .wk-tg-col .tb-time{ font-size:9.5px; }
  .wk-col{ background:var(--card); border:1.5px solid var(--line); border-radius:12px; padding:8px; min-height:150px; cursor:pointer; transition:border-color .12s; overflow:hidden; }
  .wk-col:hover{ border-color:var(--terra); }
  .wk-col.today{ border-color:var(--terra); background:var(--terra-bg); }
  .wk-head{ font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:6px; }
  .wk-col .cal-ev{ white-space:normal; margin-bottom:3px; }
  .wk-timed{ display:flex; gap:5px; align-items:flex-start; margin-bottom:3px; }
  .wk-time{ flex:none; font-size:10px; font-weight:800; color:var(--terra-deep); font-variant-numeric:tabular-nums; padding-top:2px; min-width:40px; }
  .wk-blk{ font-size:9.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-faint); margin:6px 0 2px; }
  .yr-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px; }
  .yr-month{ background:var(--card); border:1.5px solid var(--line); border-radius:12px; padding:10px; }
  .yr-month h4{ margin:0 0 6px; font-size:13px; cursor:pointer; color:var(--terra-deep); }
  .yr-days{ display:grid; grid-template-columns:repeat(7,1fr); gap:2px; font-size:10px; color:var(--ink-faint); text-align:center; }
  .yr-days span{ padding:1px 0; }
  .yr-days .busy{ background:var(--terra); color:#fff; border-radius:4px; }
  .yr-days .tod{ outline:1.5px solid var(--terra-deep); border-radius:4px; color:var(--ink); }

  :root[data-theme="dark"][data-skin="ink"]{--terra:#9a9aa8;--terra-deep:#7d7d8c;--terra-bg:#2e2e36;--slate:#2c2c33;--slate-2:#3a3a42;--paper:#151517;--sheet:#1d1d20;--card:#252529;--line:#3b3b41;--line-soft:#2d2d32;--scene:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%201600%20900'%20preserveAspectRatio='xMidYMax%20slice'%3E%3Ccircle%20cx='1215'%20cy='205'%20r='66'%20fill='%23c0c0cc'%20opacity='.3'/%3E%3Ccircle%20cx='300'%20cy='130'%20r='2.5'%20fill='%236e6e7a'/%3E%3Ccircle%20cx='520'%20cy='90'%20r='2'%20fill='%236e6e7a'/%3E%3Ccircle%20cx='720'%20cy='160'%20r='2.5'%20fill='%236e6e7a'/%3E%3Ccircle%20cx='920'%20cy='110'%20r='2'%20fill='%236e6e7a'/%3E%3Cpath%20d='M0%20585%20Q180%20470%20400%20560%20Q560%20435%20790%20555%20Q940%20468%201130%20558%20Q1310%20452%201600%20565%20V900%20H0%20Z'%20fill='%231f1f24'/%3E%3Crect%20y='585'%20width='1600'%20height='30'%20fill='%23ffffff'%20opacity='.04'/%3E%3Cpath%20d='M0%20690%20Q300%20615%20640%20680%20T1600%20660%20V900%20H0%20Z'%20fill='%2328282f'/%3E%3Cpath%20d='M980%20792%20q46%2020%20104%200%20l-11%2017%20q-40%2013%20-82%200%20Z'%20fill='%2354545f'/%3E%3Cpath%20d='M1022%20792%20q-2%20-24%208%20-34'%20stroke='%2354545f'%20stroke-width='6'%20fill='none'%20stroke-linecap='round'/%3E%3Cpath%20d='M1030%20760%20l50%20-20'%20stroke='%2354545f'%20stroke-width='3'/%3E%3Cpath%20d='M960%20828%20h60%20M1060%20838%20h44%20M1000%20850%20h52'%20stroke='%233f3f49'%20stroke-width='4'%20opacity='.7'%20stroke-linecap='round'/%3E%3Cpath%20d='M0%20832%20Q500%20792%201000%20834%20T1600%20820%20V900%20H0%20Z'%20fill='%2331313a'/%3E%3C/svg%3E");}

  /* dark mode: project colors are pastel — dark text reads better than white on them */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .pill.proj, :root:not([data-theme="light"]) .cal-ev:not(.evt),
    :root:not([data-theme="light"]) .tl-bar, :root:not([data-theme="light"]) .proj-top{ color:#1a191e; }
    :root:not([data-theme="light"]) .nav button[aria-current="true"]{ background:#141318; color:#ece9e2; }
  }
  :root[data-theme="dark"] .pill.proj, :root[data-theme="dark"] .cal-ev:not(.evt),
  :root[data-theme="dark"] .tl-bar, :root[data-theme="dark"] .proj-top{ color:#1a191e; }
  :root[data-theme="dark"] .nav button[aria-current="true"]{ background:#141318; color:#ece9e2; }

  /* motion & polish */
  html{ accent-color: var(--terra); }
  .task{ border-radius:8px; transition:background var(--dur) var(--ease); }
  /* the project's colour as a bar on the row's left edge — colour where it means something */
  li.task.pc{ box-shadow:inset 3px 0 0 var(--pc); }
  li.task.pc.done{ box-shadow:inset 3px 0 0 color-mix(in srgb, var(--pc) 45%, transparent); }
  /* time of day, in colour: the three block cards carry a warm / sky / indigo top edge */
  details.fold[data-fold="block-morning"]{ border-top:3px solid #e6b35a; }
  details.fold[data-fold="block-afternoon"]{ border-top:3px solid #5fa8d3; }
  details.fold[data-fold="block-evening"]{ border-top:3px solid #6b5fc7; }
  .task:not(.inline-row):hover{ background:var(--line-soft); }
  .chk.done::after{ animation:pop .2s ease; }
  .task.completing{ animation:settle .38s ease forwards; }
  .task.completing > .task-main .task-title{ text-decoration:line-through; color:var(--ink-faint); transition:color .25s; }
  @keyframes settle{ 40%{ background:var(--good-bg); } 100%{ opacity:.3; transform:translateX(8px); } }
  @keyframes pop{ 0%{ transform:rotate(42deg) scale(0); } 60%{ transform:rotate(42deg) scale(1.25); } 100%{ transform:rotate(42deg) scale(1); } }
  .dot:hover{ transform:scale(1.18); }
  .job-card{ transition:border-color .12s, transform .12s, box-shadow .12s; }
  .job-card:hover{ transform:translateY(-1px); box-shadow:0 6px 14px -8px var(--shadow); }
  .scrim{ animation:scrimIn .16s ease; backdrop-filter:blur(2.5px); }
  @keyframes scrimIn{ from{ opacity:0; } }
  .modal{ animation:modalIn .2s cubic-bezier(.2,.85,.3,1.15); }
  @keyframes modalIn{ from{ opacity:0; transform:translateY(12px) scale(.97); } }
  #view.anim{ animation:fadeup var(--dur) var(--ease); }
  @keyframes fadeup{ from{ opacity:0; transform:translateY(5px); } }
  details.fold[data-fold="focus"]{ border-left:4px solid var(--terra); }
  /* the "Done · n" strip at the foot of each Today card */
  details.done-strip{ margin:6px 0 0; border-top:1px dashed var(--line-soft); }
  details.done-strip>summary{ list-style:none; cursor:pointer; display:flex; align-items:center; gap:8px; padding:8px 4px 4px; font-size:12px; letter-spacing:0; text-transform:none; font-weight:600; color:var(--ink-faint); }
  details.done-strip>summary::-webkit-details-marker{ display:none; }
  details.done-strip>summary .fold-chev{ font-size:11px; transition:transform .15s; }
  details.done-strip[open]>summary .fold-chev{ transform:rotate(90deg); }
  details.done-strip>summary:hover{ color:var(--ink-soft); }
  details.done-strip .tasks{ opacity:.8; }
  details.fold>summary:hover .fold-label{ color:var(--ink); }
  .day-prog{ height:6px; max-width:360px; border-radius:999px; background:var(--line-soft); overflow:hidden; margin:10px 0 16px; }
  /* Phone-only bottom nav: the top chips are the hardest thing to reach one-handed. Hidden on wide
     screens, in print, and in the read-only snapshot view. */
  #bottomnav{ display:none; }
  @media (max-width:760px){
    #bottomnav{ position:fixed; left:0; right:0; bottom:0; z-index:60; display:flex;
      background:var(--sheet); border-top:1.5px solid var(--line);
      padding:4px max(6px,env(safe-area-inset-left)) max(6px,env(safe-area-inset-bottom)); }
    #bottomnav button{ flex:1; background:transparent; border:none; font-family:inherit; cursor:pointer;
      display:flex; flex-direction:column; align-items:center; gap:1px; padding:6px 2px 4px;
      font-size:10.5px; font-weight:700; color:var(--ink-faint); border-radius:10px; }
    #bottomnav button span{ font-size:17px; line-height:1.15; }
    #bottomnav button[aria-current="true"]{ color:var(--terra); background:var(--terra-bg); }
    body{ padding-bottom:66px; }
    .toast{ bottom:78px; }
  }
  @media print{ #bottomnav{ display:none !important; } }
  body[data-snapshot] #bottomnav{ display:none !important; }
  .today-status{ display:flex; align-items:center; gap:12px; margin:6px 0 4px; }
  .ring{ width:46px; height:46px; flex:none; transform:rotate(-90deg); }
  .ring circle{ fill:none; stroke-width:3.4; }
  .ring-bg{ stroke:var(--line-soft); }
  .ring-fg{ stroke:var(--good); stroke-linecap:round; transition:stroke-dasharray .6s var(--ease); }
  .ring text{ transform:rotate(90deg); transform-origin:18px 18px; font-size:9px; font-weight:800; fill:var(--ink); font-variant-numeric:tabular-nums; }
  .today-extras{ margin-top:18px; }
  .day-prog span{ display:block; height:100%; border-radius:999px; background:var(--good); transition:width .4s ease; }
  .now-pill{ font-size:9px; letter-spacing:.1em; background:var(--terra); color:#fff; border-radius:999px; padding:2px 7px; margin-left:6px; vertical-align:middle; }
  .streak-pill{ font-size:12px; font-weight:800; color:var(--terra-deep); background:var(--terra-bg); padding:3px 10px; border-radius:999px; white-space:nowrap; }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }

  /* search */
  .srch-row{ padding:9px 6px; border-bottom:1px solid var(--line-soft); cursor:pointer; border-radius:8px; }
  .srch-row:hover{ background: var(--terra-bg); }
  .srch-row .srch-sub{ font-size:12px; color:var(--ink-soft); margin-top:1px; }
  .srch-kind{ font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--terra-deep); margin-right:7px; }

  /* drag & drop */
  .tasks.drag-over{ outline:2px dashed var(--terra); outline-offset:3px; border-radius:8px; }
  .jobs-col.drag-over{ border-color: var(--terra); }
  .task.touch-dragging, .job-card.touch-dragging, .today-unit.touch-dragging{ opacity:.55; outline:2px solid var(--terra); outline-offset:2px; border-radius:8px; }

  /* time-blocking Day view */
  .day-head{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .day-title{ margin:0; font-size:18px; }
  .day-events{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .day-unsched{ background:var(--sheet); border:1px solid var(--line-soft); border-radius:14px; padding:10px 12px; margin-bottom:14px; }
  .day-unsched-h{ font-size:12.5px; font-weight:700; letter-spacing:0; text-transform:none; color:var(--ink-soft); margin-bottom:6px; }
  ul.day-tray{ max-height:230px; overflow-y:auto; }
  .day-tray.empty-tray{ color:var(--ink-faint); font-size:13px; padding:6px 2px; }
  .day-tray.drag-over{ outline:2px dashed var(--terra); outline-offset:3px; border-radius:10px; }
  .day-grid{ background:var(--sheet); border:1px solid var(--line-soft); border-radius:14px; overflow:hidden; }
  .hour-row{ display:flex; align-items:stretch; border-top:1px solid var(--line-soft); height:48px; }
  .day-grid{ position:relative; }
  /* the block layer floats over the slot column; during a drag it goes transparent so the hour slots
     underneath keep receiving the drop */
  .tb-layer{ position:absolute; top:0; bottom:0; left:63px; right:4px; pointer-events:none; }
  .tblock{ position:absolute; pointer-events:auto; border-radius:7px; padding:3px 8px; overflow:hidden; transition:filter var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
    cursor:pointer; font-size:12px; color:#fff; box-shadow:0 1px 3px rgba(0,0,0,.12); z-index:2;
    display:flex; flex-direction:column; gap:0; border-left:3px solid rgba(0,0,0,.18); }
  .tblock.plain{ background:var(--card); color:var(--ink); border:1.5px solid var(--line); border-left:3px solid var(--terra); }
  .tblock.done{ opacity:.5; }
  .tblock.done .tb-title{ text-decoration:line-through; }
  .tblock:hover{ filter:brightness(1.05); z-index:4; }
  .tb-time{ font-size:10px; font-weight:700; opacity:.85; line-height:1.3; }
  .day-cap{ font-size:12.5px; color:var(--ink-soft); margin:-4px 0 10px; }
  .day-jump{ position:relative; overflow:hidden; cursor:pointer; padding:4px 10px; }
  .day-jump input{ position:absolute; inset:0; opacity:0; width:100%; height:100%; cursor:pointer; }
  .day-cap.over{ color:var(--warn); }
  .tb-resize{ position:absolute; left:0; right:0; bottom:0; height:9px; cursor:ns-resize; touch-action:none; }
  .tb-resize::after{ content:""; position:absolute; left:50%; bottom:2px; width:22px; height:3px; margin-left:-11px; border-radius:2px; background:rgba(255,255,255,.55); opacity:0; transition:opacity .12s; }
  .tblock:hover .tb-resize::after, .tblock.resizing .tb-resize::after{ opacity:1; }
  .tblock.resizing{ z-index:5; box-shadow:0 6px 18px -6px rgba(0,0,0,.4); }
  .day-grid.drag-over{ outline:2px dashed var(--terra); outline-offset:-2px; }
  .tb-ghost{ position:absolute; left:2px; right:2px; border:2px dashed var(--terra); background:var(--terra-bg); border-radius:7px; pointer-events:none; z-index:6; font-size:10.5px; font-weight:800; color:var(--terra-deep); padding:2px 6px; opacity:.9; }
  .tb-title{ font-weight:650; line-height:1.25; }
  .dragging .tblock{ pointer-events:none; }
  .hour-row:first-child{ border-top:0; }
  .hour-label{ flex:0 0 62px; padding:7px 10px; font-size:11px; color:var(--ink-faint); text-align:right; border-right:1px solid var(--line-soft); user-select:none; }
  .hourslot{ position:relative; flex:1 1 auto; min-width:0; padding:4px 8px; background:linear-gradient(to bottom, transparent 50%, var(--line-soft) 50%, var(--line-soft) calc(50% + 1px), transparent calc(50% + 1px)); background-size:100% 100%; }
  .hourslot.drag-over{ background:var(--terra-bg); outline:2px dashed var(--terra); outline-offset:-2px; }
  .hourslot .tasks{ gap:4px; }
  .hourslot .task{ border-bottom:0; padding:5px 4px; }
  .now-line{ position:absolute; left:0; right:0; height:2px; background:var(--terra); z-index:3; pointer-events:none; }
  .now-line::before{ content:""; position:absolute; left:-4px; top:-3px; width:8px; height:8px; border-radius:50%; background:var(--terra); }
  .now-line::after{ content:attr(data-t); position:absolute; left:8px; top:-8px; font-size:9.5px; font-weight:800; color:var(--terra-deep); background:var(--sheet); padding:0 4px; border-radius:4px; line-height:1.5; }
  .wk-tg-col .now-line::after{ display:none; }

  /* shared read-only snapshot page */
  .snap-wrap{ max-width:680px; margin:0 auto; padding:20px 18px 60px; }
  .snap-banner{ background:var(--terra-bg); color:var(--terra-deep); border:1px solid var(--terra); border-radius:10px; padding:9px 13px; font-size:13px; margin-bottom:20px; }
  .snap-banner a{ color:var(--terra-deep); font-weight:700; }
  .snap-h1{ font-size:24px; margin:0 0 18px; }
  .snap-card{ background:var(--sheet); border:1px solid var(--line-soft); border-radius:14px; padding:14px 16px; margin-bottom:14px; }
  .snap-card h2{ font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); margin:0 0 10px; }
  .snap-list{ list-style:none; margin:0; padding:0; }
  .snap-task{ padding:7px 0; border-top:1px solid var(--line-soft); font-size:15px; }
  .snap-task:first-child{ border-top:0; }
  .snap-task.done{ opacity:.5; text-decoration:line-through; }
  .snap-meta{ font-size:12px; color:var(--ink-faint); margin-top:2px; }
  .snap-subs{ list-style:none; margin:5px 0 0; padding:0 0 0 16px; }
  .snap-sub{ font-size:13px; color:var(--ink-soft); padding:2px 0; }
  .snap-sub.done{ opacity:.5; text-decoration:line-through; }
  .snap-foot{ text-align:center; color:var(--ink-faint); font-size:12px; margin-top:24px; }
  .snap-foot a, .snap-foot a:visited{ color:var(--terra-deep); font-weight:600; }

  /* today layout — centered column + side log panel */
  .today-flex{ display:flex; gap:18px; align-items:flex-start; }
  .today-main{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:16px; }
  .today-unit{ position:relative; }
  .today-unit>.unit-grip{ position:absolute; top:-11px; left:50%; transform:translateX(-50%); z-index:4; color:var(--ink-faint); background:var(--sheet); border:1px solid var(--line-soft); border-radius:999px; cursor:grab; font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; opacity:0; transition:opacity .15s; padding:2px 10px; user-select:none; }
  .today-unit:hover>.unit-grip{ opacity:.85; }
  .today-unit.unit-over{ outline:2px dashed var(--terra); outline-offset:4px; border-radius:16px; }
  .today-unit.unit-dragging{ opacity:.5; }
  .side-panel{ flex:0 0 300px; min-width:0; position:sticky; top:74px; max-height:calc(100vh - 92px); overflow:auto; display:flex; flex-direction:column; gap:14px; }
  @media (max-width:920px){ .today-flex{ display:block; } .side-panel{ position:static; max-height:none; margin-top:16px; } }
  .day-nav{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .day-nav .icon-btn{ background:var(--slate); flex:none; }
  .panel-task{ padding:8px 0; border-bottom:1px solid var(--line-soft); }
  .panel-task:last-child{ border-bottom:none; }
  .panel-move{ display:flex; gap:4px; flex-wrap:wrap; margin-top:6px; }
  .panel-move button{ font-family:inherit; font-size:10.5px; font-weight:600; padding:2px 8px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--ink-soft); cursor:pointer; }
  .panel-move button:hover{ border-color:var(--terra); color:var(--terra-deep); }
  .panel-move button.pm-primary{ background:var(--terra); border-color:var(--terra); color:#fff; }

     you almost certainly meant — 7–11 is morning, 12–6 is afternoon/evening. A datalist gives the

  function parseLooseTime(s){
    s=String(s||"").trim().toLowerCase().replace(/\s+/g,""); if(!s) return null;

  // The hour range a set of timed tasks needs: 6am–11pm unless something sits outside it.
  function hourRange(timed){

    var earliest=timed.reduce(function(m,k){ return Math.min(m,+k.at.slice(0,2)); }, START);
    var latest=timed.reduce(function(m,k){ return Math.max(m, Math.ceil((toMins(k.at)+(k.dur||60))/60)-1); }, END);

    var blocks=timed.map(function(k){ var st=toMins(k.at), en=st+(k.dur||60); return {k:k, s:st, e:en, eL:Math.max(en,st+30)}; })

  /* The hand-coded SPU dashboard is the best-loved card in the app and dies with the semester.
     This is the same idea for any project you pin: note, progress, nearest deadline, next three. */
  /* ---------- 39: project work reaches the day ----------
     A project task carries a `due` (the deadline) but often no `day` (when you will actually do it),
     so it lives in the Backlog and never appears in Today — the gap the user hit with the IRT project.
     "Coming due" is the standing bridge: anything with a deadline inside the horizon that isn't
     already planned for today or earlier, with one tap to put it on a day. */
  var DUE_HORIZON=14;
  function comingDueTasks(){
    var t=today();
    return S.tasks.filter(function(k){
      return isOpen(k) && k.due && inScope(k.projectId) &&
        diffDays(k.due,t)<=DUE_HORIZON && !(k.day && k.day<=t);
    }).sort(function(a,b){ return a.due.localeCompare(b.due) || (a.day||"9999").localeCompare(b.day||"9999"); });
  }
  function comingDueRow(k){
    var p=k.projectId?proj(k.projectId):null;
    var t=today(), d=diffDays(k.due,t);
    var lead=d<=0?t:addDays(k.due,-1);    // "start it" = the day before the deadline at the latest
    return '<li class="task'+(p?" pc":"")+'" data-id="'+k.id+'"'+(p?' style="--pc:'+esc(p.color)+'"':'')+'>'+

      '<div class="task-meta">'+duePill(k)+
        (p?'<span class="pill proj" style="--pc:'+esc(p.color)+'"><i class="pdot"></i>'+(p.emoji?esc(p.emoji)+" ":"")+esc(p.name)+'</span>':'')+
        (k.day?'<span class="pill block">planned '+esc(niceDate(k.day))+'</span>':'<span class="pill aged">no day yet</span>')+
      '</div></div>'+
      '<button class="chip" data-act="dueday" data-d="'+t+'" title="Do it today">→ Today</button>'+
      (lead>t?'<button class="chip" data-act="dueday" data-d="'+lead+'" title="Plan it for '+esc(niceDate(lead))+'">→ '+esc(niceDate(lead))+'</button>':'')+
      '<button class="task-focus'+(inFocus(k.id)?" on":"")+'" data-act="tofocus" aria-label="Add to Today’s Focus" title="Add to Today’s Focus">◎</button>'+
      '</li>';
  }
  // The phase a project is in right now (or the next one up), so a brief can count down to it.
  function phaseNow(pid){
    var t=today(), ph=S.phases.filter(function(x){return x.projectId===pid;})
      .sort(function(a,b){ return (a.start||"").localeCompare(b.start||""); });
    var cur=ph.filter(function(x){ return x.start<=t && x.end>=t; })[0];
    if(cur) return {ph:cur,state:"now"};
    var next=ph.filter(function(x){ return x.start>t; })[0];
    if(next) return {ph:next,state:"next"};
    var last=ph[ph.length-1];
    return last?{ph:last,state:"past"}:null;
  }
  /* ---------- 40b: habits in the day ----------
     A habit with `inDay` renders as a row in the day list. It is a VIRTUAL row — never a stored task —
     so it cannot pile up, carry, or duplicate; the tick writes `habitLog[day][id]` and the streak is the
     record. Prayer and Check Emails were daily repeats because habits didn't appear where the user
     lives; this makes that unnecessary. */
  function habitLog(day,hid){ return ((S.habitLog[day]||{})[hid])||0; }
  function habitDoneOn(h,day){ return habitLog(day,h.id)>=(h.goal||1); }
  function setHabitLog(day,hid,val){ S.habitLog[day]=S.habitLog[day]||{}; S.habitLog[day][hid]=Math.max(0,val); }
  function habitTick(hid,day){
    var h=S.habits.find(function(x){return x.id===hid;}); if(!h) return;
    var cur=habitLog(day,hid), goal=h.goal||1;
    setHabitLog(day,hid, cur>=goal?0:cur+1);     // at goal, a tap un-ticks; below it, one more
    save(); render();
  }
  function inFocusHabit(hid){ return (S.focus[viewDay]||[]).some(function(f){return f.habitId===hid;}); }
  function habitRowHtml(h,day){
    var log=habitLog(day,h.id), goal=h.goal||1, done=log>=goal, st=habitStreak(h.id);
    return '<li class="task habit-row'+(done?" done":"")+'" data-hid="'+h.id+'">'+
      '<button class="chk '+(done?"done":"")+'" data-act="habit-tick" aria-label="'+esc(h.name)+'" aria-pressed="'+done+'"></button>'+
      '<div class="task-main" data-act="edithabit" data-hid="'+h.id+'" title="Tap to edit the habit"><div class="task-title">'+esc(h.name)+'</div>'+
      '<div class="task-meta"><span class="pill rec">🌱 habit</span>'+
        (goal>1?'<span class="pill block">'+Math.min(log,goal)+' / '+goal+'</span>':'')+
        (st>1?'<span class="pill imp">🔥 '+st+'</span>':'')+'</div></div>'+
      '<span class="row-br"></span>'+
      '<button class="task-focus'+(inFocusHabit(h.id)?" on":"")+'" data-act="habit-focus" aria-label="Add to Today’s Focus" title="Add to Today’s Focus">◎</button>'+
      '</li>';
  }

  /* ---------- suggestions engine (local, explainable) ---------- */
  function norm(s){ return (s||"").trim().toLowerCase(); }
  // Shared by the ⋯ button and the Hub suggestion — the store syncs to a gist and localStorage tops
  // out around 5MB, so old done tasks should leave the working set before that ever matters.
  function confirmArchiveOldDone(){
    var cut=addDays(today(),-60);
    var old=S.tasks.filter(function(k){return k.status==="done"&&k.completedOn&&k.completedOn<cut;});
    if(!old.length){ toast("Nothing old enough to archive yet"); return; }
    confirmModal("Archive "+old.length+" old completed task"+(old.length===1?"":"s")+"?","They leave the lists and log but stay in your data, backups and search. This keeps the app fast as years accumulate.","Archive",function(){
      S.archive=S.archive.concat(old);
      S.tasks=S.tasks.filter(function(k){return old.indexOf(k)<0;});
      save(); render(); toast(old.length+" archived");
    });
  }
  function computeSuggestions(){
    var t=today(), out=[], d=S.dismissed;
    // 1. aged tasks
    S.tasks.filter(function(k){return k.status==="todo"&&taskOnDay(k,t)&&(k.rollover||0)>=3;}).slice(0,1).forEach(function(k){
      var id="aged-"+k.id; if(d.indexOf(id)<0) out.push({id:id,text:'<b>“'+esc(k.title)+'”</b> has carried '+k.rollover+' days. Break it into a smaller next step, or let it go?'});
    });
    // 2. frequently completed titles not present today
    var freq={};
    S.tasks.filter(function(k){return k.status==="done";}).forEach(function(k){ var n=norm(k.title); if(n) freq[n]=(freq[n]||0)+1; });
    var todayTitles=S.tasks.filter(function(k){return taskOnDay(k,t);}).map(function(k){return norm(k.title);});
    Object.keys(freq).filter(function(n){return freq[n]>=3 && todayTitles.indexOf(n)<0;})
      .sort(function(a,b){return freq[b]-freq[a];}).slice(0,1).forEach(function(n){
        var id="rep-"+n; if(d.indexOf(id)<0){
          var ex=S.tasks.find(function(k){return norm(k.title)===n;});
          out.push({id:id,text:'You\'ve done <b>“'+esc(ex.title)+'”</b> '+freq[n]+' times. Make it a task for today?',action:"Add",data:{title:ex.title,projectId:ex.projectId}});
        }
      });
    // 3. quiet projects
    S.projects.forEach(function(p){
      var last=null;
      S.tasks.forEach(function(k){ if(k.projectId===p.id){ var dd=k.completedOn||k.day||k.created; if(dd&&(!last||dd>last)) last=dd; }});
      if(last && diffDays(t,last)>=7){ var id="quiet-"+p.id; if(d.indexOf(id)<0) out.push({id:id,text:'<b>'+esc(p.name)+'</b> has been quiet for '+diffDays(t,last)+' days. Anything to move forward?'}); }
    });
    // 4. weekday pattern
    var wd=dow(t), wdmap={};
    S.tasks.filter(function(k){return k.status==="done"&&k.completedOn;}).forEach(function(k){
      if(dow(k.completedOn)===wd){ var n=norm(k.title); if(n) wdmap[n]=(wdmap[n]||0)+1; }
    });
    Object.keys(wdmap).filter(function(n){return wdmap[n]>=2 && todayTitles.indexOf(n)<0;}).slice(0,1).forEach(function(n){
      var id="wd-"+wd+"-"+n; if(d.indexOf(id)<0){ var ex=S.tasks.find(function(k){return norm(k.title)===n;});
        out.push({id:id,text:'You usually do <b>“'+esc(ex.title)+'”</b> on '+DOWNAMES[wd]+'s.',action:"Add",data:{title:ex.title,projectId:ex.projectId}}); }
    });
    // 5. sync file needs a permission tap after browser restart
    if(syncReconnect && d.indexOf("sync-reconnect")<0) out.push({id:"sync-reconnect",text:'Your <b>sync file</b> needs a quick permission tap after the browser restarted.',action:"Reconnect",act:"sync"});
    // 6. weekly review nudge — start of the week, once per week
    var wd0=dow(t);
    if(wd0===0||wd0===1){ var wkid="review-"+addDays(t,-wd0);
      if(d.indexOf(wkid)<0) out.push({id:wkid,text:'A fresh week — run a <b>2-minute weekly review</b> to clear carried tasks and pick what matters.',action:"Review",act:"review"});
    }
    // 6b. archive nudge — once a month, only when there is a real pile
    var archOld=S.tasks.filter(function(k){return k.status==="done"&&k.completedOn&&k.completedOn<addDays(t,-60);}).length;
    if(archOld>=25){ var aid="arch-"+t.slice(0,7);
      if(d.indexOf(aid)<0) out.push({id:aid,text:archOld+' completed tasks are over two months old. <b>Archive</b> them to keep the app fast — they stay in your data and search.',action:"Archive",act:"archive"});
    }
    // 7. backup reminder — only when no sync is safeguarding the data
    var synced = (GH&&GH.gistId) || syncHandle;
    var stale = S.lastExport ? diffDays(t,S.lastExport)>=30 : S.tasks.length>=15;
    if(stale && !synced){ var bid="backup-"+t.slice(0,7); if(d.indexOf(bid)<0) out.push({id:bid,text:'Your work saves in this browser automatically, but only here. Turn on <b>☁️ Cloud sync</b> (⋯ menu) or <b>export a backup</b> so a cleared browser or lost device can\'t take it with it.'+(S.lastExport?' Last backup: '+diffDays(t,S.lastExport)+' days ago.':''),action:"Export",act:"export"}); }
    return out.slice(0,4);
  }
  function doneStreak(){
    var days={}; S.tasks.forEach(function(k){ if(k.completedOn) days[k.completedOn]=1; });
    var s=0, d=today(); if(!days[d]) d=addDays(d,-1);
    while(days[d]){ s++; d=addDays(d,-1); }
    return s;
  }
  function habitStreak(hid){
    var s=0, d=today();
    for(var i=0;i<400;i++){ var day=addDays(d,-i); var v=(S.habitLog[day]||{})[hid]||0; var h=S.habits.find(function(x){return x.id===hid;});
      if(h && v>=h.goal) s++; else { if(i===0) continue; break; } }
    return s;
  }

  function viewBacklog(){

      phs.map(function(ph){ var l=pct(ph.start), w=Math.max(1.5,pct(addDays(ph.end,1))-l);

  // Parse a textarea into routine items. One task per line; leading * or ! = important; a line starting with "-" or "  " (indent) = a subtask of the task above.
  function parseRoutineItems(text){
    var items=[], cur=null;
    (text||"").split(/\r?\n/).forEach(function(raw){
      if(!raw.trim()) return;
      var isSub=/^(\s{2,}|\t|-\s|•\s|•)/.test(raw);
      var line=raw.replace(/^\s+/,"").replace(/^[-•]\s*/,"").trim();
      if(isSub && cur){ cur.subs.push(line); return; }
      var imp=/^[*!]\s*/.test(line); if(imp) line=line.replace(/^[*!]\s*/,"").trim();
      var at=null, tm=line.match(/@\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/i);
      if(tm){ var h=+tm[1]%24; if((tm[3]||"").toLowerCase()==="pm"&&h<12)h+=12; if((tm[3]||"").toLowerCase()==="am"&&h===12)h=0; at=String(h).padStart(2,"0")+":"+(tm[2]||"00"); line=line.replace(tm[0],"").trim(); }
      if(!line) return;
      cur={title:line,priority:imp,at:at,block:at?null:null,subs:[]}; items.push(cur);
    });
    return items;
  }
  function routineItemsToText(r){
    return (r.items||[]).map(function(it){
      var head=(it.priority?"* ":"")+it.title+(it.at?" @"+fmtTime(it.at):"");
      var subs=(it.subs||[]).map(function(s){return "  - "+s;}).join("\n");
      return head+(subs?"\n"+subs:"");
    }).join("\n");
  }

  function recDesc(tp){
    if(tp.freq==="daily") return "↻ daily";
    if(tp.freq==="weekly") return "↻ weekly · "+((tp.weekdays||[]).map(function(w){return DOWNAMES[w];}).join(" ")||"no days");
    return "↻ every "+(tp.interval||2)+" days";
  }

  /* ---------- CALENDAR ---------- */
  function calAnchorDate(){ return S.calAnchor||today(); }
  // Which part of a multi-day run this day is: bars square off the side the run continues on, so a
  // span reads as one strip across the calendar instead of the same title repeated per cell.
  /* `day` is when you PLAN to do a thing; `due` is when the world needs it done. Conflating them is
     why a task planned optimistically in July reads as "carried 41d" in August when its real deadline
     is Wednesday. due is optional; absent means "whenever". */
  function duePill(k){
    if(!k.due) return "";
    var t=today(), d=diffDays(k.due,t);
    var lbl = d<0 ? "overdue "+(-d)+"d" : d===0 ? "due today" : d===1 ? "due tomorrow" : "due "+niceDate(k.due);
    return '<span class="pill due'+(d<=1?" hot":"")+'" title="Due '+esc(niceDate(k.due))+'">⚑ '+lbl+'</span>';
  }
  // sort helper: real deadlines first (earliest), then most-carried — the review and briefs share it
  function byUrgency(a,b){
    return (a.due||"9999").localeCompare(b.due||"9999") || (b.rollover||0)-(a.rollover||0) || (a.day||"9999").localeCompare(b.day||"9999");
  }
  function spanPos(start,end,ds){
    if(!end||end<=start) return null;
    return ds===start?"start":(ds===end?"end":"mid");
  }
  function dayItems(ds){
    var items=[];
    S.tasks.forEach(function(k){ if(taskOnDay(k,ds)&&inScope(k.projectId)) items.push({id:k.id,t:k.title,c:projColor(k.projectId),done:k.status==="done",imp:!!k.priority,at:k.at||null,block:k.block||null,sp:spanPos(k.day,k.end,ds)}); });
    S.events.forEach(function(ev){ if(!evOnDay(ev,ds)||!sourceEnabled(ev)) return; if(ev.projectId&&!inScope(ev.projectId)) return; var c=ev.color||(ev.projectId?projColor(ev.projectId):null); items.push({t:ev.title,c:c,evt:!c,sp:spanPos(ev.date,ev.end,ds)}); });
    // spans first, in a stable order — if a middle day is busy and the cell truncates, the bar must
    // survive the cut or the strip breaks visually
    items.sort(function(a,b){ return (b.sp?1:0)-(a.sp?1:0) || (a.t<b.t?-1:1); });
    return items;
  }
  function spanDays(cv,a){
    var st,n;
    if(cv==="3day"){ st=a; n=3; }
    else if(cv==="workweek"){ var w=dow(a); st=addDays(a,(w===0?-6:1-w)); n=5; }
    else { st=addDays(a,-dow(a)); n=7; }
    var out=[]; for(var i=0;i<n;i++) out.push(addDays(st,i));
    return out;
  }
  function calTitle(cv,a){
    if(cv==="month") return MONTHS[+a.slice(5,7)-1]+" "+a.slice(0,4);
    if(cv==="year") return a.slice(0,4);
    var days=spanDays(cv,a); var s=parse(days[0]), e=parse(days[days.length-1]);
    return MONTHS[s.getMonth()].slice(0,3)+" "+s.getDate()+" – "+(e.getMonth()!==s.getMonth()?MONTHS[e.getMonth()].slice(0,3)+" ":"")+e.getDate()+", "+e.getFullYear();
  }
  function viewCalendar(){
    var cv=S.calView||"month"; var a=calAnchorDate();
    var html='<h2 class="view-h">Calendar</h2><p class="sub">Deadlines, milestones, and imported events — color-coded by project.'+(scopeActive()?' <b>Filtered:</b> '+esc(scopeLabel())+' — <button class="chip" data-act="clearscope" style="padding:2px 9px">show all</button>':'')+'</p>';
    html+='<div class="cal-head"><button class="icon-btn" style="background:var(--slate)" data-act="cal" data-d="-1" aria-label="Back">‹</button>'+
      '<h3>'+calTitle(cv,a)+'</h3>'+
      '<button class="icon-btn" style="background:var(--slate)" data-act="cal" data-d="1" aria-label="Forward">›</button>'+
      '<button class="chip" data-act="cal" data-d="0" style="margin-left:6px">Today</button>'+
      '<button class="chip" data-act="calendars" style="margin-left:auto">🗓 Calendars</button>'+
      '<button class="chip" data-act="import-ics">⤓ Import file</button></div>';
    html+='<div class="chips" style="margin-bottom:14px">'+[["week","7 days"],["workweek","Work week"],["3day","3 days"],["year","Year"]].map(function(v){return '<button class="chip" data-act="calview" data-v="'+v[0]+'" aria-pressed="'+(cv===v[0])+'">'+v[1]+'</button>';}).join("")+'</div>';
    if(S.calSources.length) html+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">'+S.calSources.map(function(s){return '<span class="pill" style="background:'+(s.enabled?s.color:"var(--line)")+';color:#fff">'+esc(s.name)+(s.error?" ⚠":"")+'</span>';}).join("")+'</div>';
    if(cv==="month") html+=monthGridHtml(a);
    else if(cv==="year") html+=yearGridHtml(+a.slice(0,4));
    else html+=weekTimeGridHtml(spanDays(cv,a));
    return html;
  }
  function monthGridHtml(a){
    var y=+a.slice(0,4), mo=+a.slice(5,7)-1;
    var startPad=new Date(y,mo,1).getDay();
    var daysIn=new Date(y,mo+1,0).getDate();
    var t=today();
    var html='<div class="cal-grid">'+DOWNAMES.map(function(d){return '<div class="cal-dow">'+d+'</div>';}).join("");
    for(var i=0;i<startPad;i++) html+='<div class="cal-cell dim"></div>';
    for(var day=1;day<=daysIn;day++){
      var ds=y+"-"+String(mo+1).padStart(2,"0")+"-"+String(day).padStart(2,"0");
      var items=dayItems(ds).filter(function(it){return !it.done;});
      var cells="";
      items.slice(0,3).forEach(function(it){ cells+='<div class="cal-ev '+(it.evt?"evt":"")+(it.sp?" sp-"+it.sp:"")+'"'+(it.id?' draggable="true" data-tid="'+it.id+'"':'')+' style="'+(it.c&&!it.evt?"background:"+it.c:"")+'">'+(it.imp?"★ ":"")+(it.sp&&it.sp!=="start"?"":esc(it.t))+'</div>'; });
      if(items.length>3) cells+='<div class="cal-more">+'+(items.length-3)+' more</div>';
      html+='<div class="cal-cell '+(ds===t?"today":"")+'" data-act="calday" data-d="'+ds+'"><div class="cal-daynum">'+day+'</div>'+cells+'</div>';
    }
    return html+'</div>';
  }
  /* Week / Work week / 3 days as a real time grid: one shared hour axis, a column per day, timed tasks
     as positioned blocks (same layer as the Day view, so click-to-edit, drag-to-move, resize all work
     across days), and an all-day strip above for anything without a clock time — drag a pill down
     into the grid to give it one, or a block up into the strip to take it away. */
  function weekTimeGridHtml(days){
    var t=today(), perDay=days.map(function(ds){

  function weekGridHtml(cv,a){

    var html='<div class="wk-cols" style="grid-template-columns:repeat('+days.length+',1fr)">';
    days.forEach(function(ds){

      var timed=items.filter(function(it){return it.at;}).sort(function(x,y){return x.at<y.at?-1:1;});
      var blocked=items.filter(function(it){return !it.at&&it.block;});
      var loose=items.filter(function(it){return !it.at&&!it.block;});
      html+='<div class="wk-col '+(ds===t?"today":"")+'" data-act="calday" data-d="'+ds+'">'+
        '<div class="wk-head">'+DOWNAMES[d.getDay()]+' <b>'+d.getDate()+'</b>'+(items.length?' <span style="font-weight:600;color:var(--ink-faint)">· '+items.length+'</span>':"")+'</div>';

      timed.forEach(function(it){ html+='<div class="wk-timed"><span class="wk-time">'+fmtTime(it.at)+'</span><div class="cal-ev '+(it.evt?"evt":"")+'"'+(it.id?' draggable="true" data-tid="'+it.id+'"':'')+' style="flex:1;'+(it.c&&!it.evt?"background:"+it.c:"")+(it.done?";opacity:.45;text-decoration:line-through":"")+'">'+(it.imp?"★ ":"")+esc(it.t)+'</div></div>'; });
      // by block (no clock time)
      ["morning","afternoon","evening"].forEach(function(b){
        var bi=blocked.filter(function(it){return it.block===b;});
        if(bi.length){ html+='<div class="wk-blk">'+({morning:"☀︎",afternoon:"🌤",evening:"🌙"}[b])+' '+b+'</div>'+bi.map(evHtml).join(""); }
      });
      if(loose.length){ if(timed.length||blocked.length) html+='<div class="wk-blk">— anytime —</div>'; loose.forEach(function(it){ html+=evHtml(it); }); }

  function yearGridHtml(y){

    S.events.forEach(function(e){ if(!e.date||!sourceEnabled(e)||(e.projectId&&!inScope(e.projectId))) return;
      for(var ed0=e.date, last0=lastDay(e.date,e.end); ed0<=last0; ed0=addDays(ed0,1)){ if(ed0.slice(0,4)===String(y)) busy[ed0]=1; }
    });
    var t=today();
    var html='<div class="yr-grid">';
    for(var m=0;m<12;m++){
      var daysIn=new Date(y,m+1,0).getDate(); var pad=new Date(y,m,1).getDay();
      var mm=String(m+1).padStart(2,"0");

  /* ---------- [[wikilinks]] (Phase 13) ----------
     Typed anywhere in a note, [[Name]] resolves against projects, people, and open task titles.
     Rendered read-only (Journal, day detail) so the editable surface stays plain text you can trust. */
  function wikiTarget(name){
    var n=norm(name);
    var pr=S.projects.find(function(x){return norm(x.name)===n;}); if(pr) return {kind:"project",id:pr.id,label:pr.name,color:pr.color};
    var pe=S.people.find(function(x){return norm(x.name)===n;}); if(pe) return {kind:"person",id:pe.id,label:pe.name,color:pe.color||"var(--p5)"};
    var tk=S.tasks.find(function(x){return norm(x.title)===n;}); if(tk) return {kind:"task",id:tk.id,label:tk.title,color:"var(--p4)"};
    return null;
  }
  function wikiLinkHtml(html){
    return String(html||"").replace(/\[\[([^\]|]{1,80})\]\]/g, function(_,name){
      name=name.trim(); var t=wikiTarget(name);
      if(!t) return '<span class="wl wl-missing" title="Nothing called that yet">[['+esc(name)+']]</span>';
      return '<button type="button" class="wl" data-act="wiki" data-kind="'+t.kind+'" data-id="'+t.id+'" style="'+cbg(t.color)+'" title="Open this '+t.kind+'">'+esc(t.label)+'</button>';
    });
  }
  // Bare URLs in a note become real links; combined with wikiLinkHtml this is what "reference links"
  // means in practice — you paste a URL or type [[a name]] and it just works, no separate field to manage.
  function autoLinkHtml(html){
    return String(html||"").replace(/(^|[\s>(])((?:https?:\/\/|www\.)[^\s<>()"']+)/g, function(m,pre,url){
      var href=/^www\./i.test(url)?("https://"+url):url;
      var label=url.replace(/^https?:\/\//,"").replace(/\/$/,"");
      if(label.length>46) label=label.slice(0,44)+"…";
      return pre+'<a class="reflink" href="'+esc(href)+'" target="_blank" rel="noopener noreferrer">🔗 '+esc(label)+'</a>';
    });
  }
  // one call for anywhere a note is displayed rather than edited
  function noteDisplayHtml(html){ return autoLinkHtml(wikiLinkHtml(html)); }
  /* ---------- JOURNAL (Phase 13) — every day you wrote something, newest first ---------- */
  /* ---------- JOURNAL (33a) ----------

     focused minutes). Today's entry is an editor at the top — the same "daily" RTE the Today card uses,
     so the two never disagree. History is grouped by month with a month strip to jump, and a search
     box. Attachments are links, not files: localStorage is ~5MB and syncs to a gist, so the file stays
     where it lives (iCloud, Drive, a URL) and the Journal remembers where. */
  var jrQuery="", jrMonth=null;

    var done=S.tasks.filter(function(k){ return k.status==="done" && k.completedOn===d; }).length;

    var hl=S.habitLog[d]; if(hl){ var hv=Object.keys(hl).reduce(function(a,k){ return a+(hl[k]||0); },0); if(hv) bits.push("🌱 "+hv+" habit ticks"); }
    return bits.join(" · ");

      return '<span class="jr-link"><a href="'+esc(l.url)+'" target="_blank" rel="noopener noreferrer">'+(/\.(png|jpe?g|gif|heic|webp)(\?|$)/i.test(l.url)?"🖼":(/\.pdf(\?|$)/i.test(l.url)?"📄":"🔗"))+' '+esc(label)+'</a>'+

  var LESSONS=[
    {id:"yet",emoji:"🌱",title:"The power of “not yet”",min:2,
     body:["Gena means “still / not yet” in Amharic, and that is the whole idea of a growth mindset in two words. When a task sits undone, there are two stories you can tell: “I can’t do this” or “I can’t do this yet.” The first is a verdict about who you are; the second is a status report about where you are.",
           "Research on mindset (Carol Dweck’s work is the best known) finds that people who treat ability as something that grows with effort, strategy and feedback persist longer, recover faster from setbacks and, over time, do better — not because they believe harder, but because “yet” keeps the next step in view.",
           "In this planner, a carried task is not a failure count. It is a task that is not done yet. The question is always the same: what is the smallest next step?"],

           "That is what a time block is. Giving a task a start time is not bureaucracy; it is pre-deciding. And the cue does not have to be a clock: “when I finish lunch”, “when I sit down at the desk” work just as well.",

    {id:"efficacy",emoji:"💪",title:"Where confidence actually comes from",min:2,
     body:["Self-efficacy — the belief that you can do a specific thing — is not a personality trait. Albert Bandura traced it to four sources, and the strongest by a wide margin is mastery experience: having done a version of it before. Second is watching someone like you do it; third is being told you can; last, and weakest, is how you feel in the moment.",

    {id:"habits",emoji:"🔁",title:"Habits are loops, not wishes",min:2,

    {id:"planning",emoji:"📐",title:"Why everything takes longer",min:2,

           "The correction is boring and works: give tasks a length, then compare the plan to the day you actually have. A day with nine hours of tasks and five hours of time is not a productivity problem; it is an arithmetic problem, and it is better to see it at 9 am than at 9 pm.",
